<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Refining Perak System - Firebase Cloud Version</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Custom scrollbar halus untuk mobile navigation */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-amber-500 selection:text-slate-900">
  <div id="root"></div>

  <!-- MODULE SCRIPT FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, getDocs, doc, setDoc, updateDoc, deleteDoc, query, orderBy, onSnapshot, getDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDs8_zsiK6lbZa_8Jva5t0CoYbgT3rVHSw",
      authDomain: "refining-perak-app.firebaseapp.com",
      projectId: "refining-perak-app",
      storageBucket: "refining-perak-app.firebasestorage.app",
      messagingSenderId: "45607676754",
      appId: "1:45607676754:web:785719de3ae74fa235a88b",
      measurementId: "G-54H37SLNPY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.fbDb = db;
    window.fbAuth = auth;
    window.fbFS = {
      collection, addDoc, getDocs, doc, setDoc, updateDoc, deleteDoc, query, orderBy, onSnapshot, getDoc,
      signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged
    };
  </script>

  <!-- SCRIPT APLIKASI REACT -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_CATEGORIES = [
      { code: 'A', name: 'Pentolan Kontaktor' },
      { code: 'B', name: 'Kontak Point' },
      { code: 'C', name: 'Ex Breaker' },
      { code: 'D', name: 'Mata Ikan (Ex Relay)' },
      { code: 'E', name: 'Mata Ikan (Ex Kontaktor)' },
      { code: 'F', name: 'Tembaga Plating Perak' },
      { code: 'G', name: 'Fuse' },
      { code: 'H', name: 'Patung' },
      { code: 'I', name: 'ACB' }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [authMode, setAuthMode] = useState('login');
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');

      const [signupNama, setSignupNama] = useState('');
      const [signupEmail, setSignupEmail] = useState('');
      const [signupPassword, setSignupPassword] = useState('');

      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');

      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchTerm, setSearchTerm] = useState('');
      const [loading, setLoading] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const [transactions, setTransactions] = useState([]);
      const [categories, setCategories] = useState([]);
      const [pemodalList, setPemodalList] = useState([]);
      const [withdrawalList, setWithdrawalList] = useState([]);
      const [additionList, setAdditionList] = useState([]);
      const [userList, setUserList] = useState([]);

      const [newCatCode, setNewCatCode] = useState('');
      const [newCatName, setNewCatName] = useState('');

      const [nisbahPengelolaPct, setNisbahPengelolaPct] = useState(0);

      const getTodayFormatted = () => {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      };

      const getCurrentMonthFormatted = () => {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        return `${y}-${m}`;
      };

      // STATE FILTER TANGGAL KHUSUS MENU PEMODAL
      const [pemodalFilterType, setPemodalFilterType] = useState('ALL');
      const [pemodalFilterMonth, setPemodalFilterMonth] = useState(getCurrentMonthFormatted());
      const [pemodalStartDate, setPemodalStartDate] = useState('');
      const [pemodalEndDate, setPemodalEndDate] = useState('');

      // STATE FILTER MENU LAPORAN
      const [reportFilterBy, setReportFilterBy] = useState('PEMBELIAN');
      const [reportFilterType, setReportFilterType] = useState('ALL');
      const [reportFilterMonth, setReportFilterMonth] = useState(getCurrentMonthFormatted());
      const [reportStartDate, setReportStartDate] = useState('');
      const [reportEndDate, setReportEndDate] = useState('');

      // STATE FILTER UNTUK TAB NERACA KAS & SALDO
      const [neracaFilterType, setNeracaFilterType] = useState('ALL');
      const [neracaFilterMonth, setNeracaFilterMonth] = useState(getCurrentMonthFormatted());
      const [neracaStartDate, setNeracaStartDate] = useState('');
      const [neracaEndDate, setNeracaEndDate] = useState('');

      const [formPemodal, setFormPemodal] = useState({
        namaPemodal: '',
        jumlahModal: '',
        tanggalBergabung: getTodayFormatted(),
        kontak: '',
        catatan: ''
      });

      // STATE MODAL PENARIKAN MODAL
      const [selectedPemodalWithdraw, setSelectedPemodalWithdraw] = useState(null);
      const [formWithdraw, setFormWithdraw] = useState({
        tanggal: getTodayFormatted(),
        jumlahTarik: '',
        catatan: ''
      });

      // STATE MODAL TAMBAH MODAL
      const [selectedPemodalAdd, setSelectedPemodalAdd] = useState(null);
      const [formAddModal, setFormAddModal] = useState({
        tanggal: getTodayFormatted(),
        jumlahTambah: '',
        catatan: ''
      });

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 4000);
      };

      const formatRupiah = (val) => {
        if (val === undefined || val === null || isNaN(val)) return 'Rp 0';
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
      };

      useEffect(() => {
        const checkFB = setInterval(() => {
          if (window.fbAuth) {
            clearInterval(checkFB);
            const { onAuthStateChanged, doc, getDoc } = window.fbFS;
            onAuthStateChanged(window.fbAuth, async (user) => {
              if (user) {
                let userRole = 'Petugas';
                let displayName = user.displayName || user.email.split('@')[0];

                try {
                  const userSnap = await getDoc(doc(window.fbDb, "users", user.uid));
                  if (userSnap.exists()) {
                    const userData = userSnap.data();
                    if (userData.nama) displayName = userData.nama;
                    if (userData.role) userRole = userData.role;
                  }
                } catch (e) {
                  console.error("Gagal mengambil profile user:", e);
                }

                setCurrentUser({ uid: user.uid, nama: displayName, email: user.email, role: userRole });
              } else {
                setCurrentUser(null);
              }
            });
          }
        }, 100);
      }, []);

      // FETCH DAFTAR USERS (HANYA UNTUK ADMIN)
      useEffect(() => {
        if (!currentUser || currentUser.role !== 'Admin') return;

        const checkUsers = setInterval(() => {
          if (window.fbDb) {
            clearInterval(checkUsers);
            const { collection, onSnapshot } = window.fbFS;
            const unsubscribe = onSnapshot(collection(window.fbDb, "users"), (snapshot) => {
              const list = [];
              snapshot.forEach((docSnap) => list.push({ uid: docSnap.id, ...docSnap.data() }));
              setUserList(list);
            });
            return () => unsubscribe();
          }
        }, 100);
      }, [currentUser]);

      // SINKRONISASI NAMA LOGIN DENGAN FORM INPUT
      useEffect(() => {
        if (currentUser && currentUser.nama) {
          setFormAmbil(prev => ({ ...prev, pengambilSelect: currentUser.nama }));
          setFormOlah(prev => ({ ...prev, pengolahSelect: currentUser.nama }));
        }
      }, [currentUser]);

      useEffect(() => {
        if (!currentUser) return;

        const checkCat = setInterval(() => {
          if (window.fbDb) {
            clearInterval(checkCat);
            const { collection, query, orderBy, onSnapshot } = window.fbFS;
            const q = query(collection(window.fbDb, "categories"), orderBy("code", "asc"));

            const unsubscribe = onSnapshot(q, (snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setCategories(list.length > 0 ? list : DEFAULT_CATEGORIES);
            });

            return () => unsubscribe();
          }
        }, 100);
      }, [currentUser]);

      useEffect(() => {
        if (!currentUser) return;
        setLoading(true);

        const checkDB = setInterval(() => {
          if (window.fbDb) {
            clearInterval(checkDB);
            const { collection, query, orderBy, onSnapshot } = window.fbFS;
            const q = query(collection(window.fbDb, "transactions"), orderBy("createdAt", "desc"));

            const unsubscribe = onSnapshot(q, (snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setTransactions(list);
              setLoading(false);
            });

            return () => unsubscribe();
          }
        }, 100);
      }, [currentUser]);

      useEffect(() => {
        if (!currentUser) return;

        const checkPemodal = setInterval(() => {
          if (window.fbDb) {
            clearInterval(checkPemodal);
            const { collection, query, orderBy, onSnapshot } = window.fbFS;
            const q = query(collection(window.fbDb, "pemodal"), orderBy("createdAt", "desc"));

            const unsubscribe = onSnapshot(q, (snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setPemodalList(list);
            });

            return () => unsubscribe();
          }
        }, 100);
      }, [currentUser]);

      // FETCH DATA PENARIKAN MODAL
      useEffect(() => {
        if (!currentUser) return;

        const checkWD = setInterval(() => {
          if (window.fbDb) {
            clearInterval(checkWD);
            const { collection, query, orderBy, onSnapshot } = window.fbFS;
            const q = query(collection(window.fbDb, "pemodal_withdrawals"), orderBy("createdAt", "desc"));

            const unsubscribe = onSnapshot(q, (snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setWithdrawalList(list);
            });

            return () => unsubscribe();
          }
        }, 100);
      }, [currentUser]);

      // FETCH DATA PENAMBAHAN MODAL
      useEffect(() => {
        if (!currentUser) return;

        const checkADD = setInterval(() => {
          if (window.fbDb) {
            clearInterval(checkADD);
            const { collection, query, orderBy, onSnapshot } = window.fbFS;
            const q = query(collection(window.fbDb, "pemodal_additions"), orderBy("createdAt", "desc"));

            const unsubscribe = onSnapshot(q, (snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setAdditionList(list);
            });

            return () => unsubscribe();
          }
        }, 100);
      }, [currentUser]);

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setAuthError('');

        try {
          const { signInWithEmailAndPassword } = window.fbFS;
          await signInWithEmailAndPassword(window.fbAuth, loginEmail.trim(), loginPassword.trim());
          setLoading(false);
          showToast('Berhasil Masuk!');
        } catch (err) {
          setLoading(false);
          setAuthError('Email atau Password salah / Akun belum terdaftar.');
        }
      };

      const handleSignUpSubmit = async (e) => {
        e.preventDefault();
        if (!signupNama.trim() || !signupEmail.trim() || !signupPassword.trim()) {
          return setAuthError('Semua bidang harus diisi!');
        }

        setLoading(true);
        setAuthError('');

        try {
          const { createUserWithEmailAndPassword, doc, setDoc } = window.fbFS;
          const userCred = await createUserWithEmailAndPassword(window.fbAuth, signupEmail.trim(), signupPassword.trim());
          
          await setDoc(doc(window.fbDb, "users", userCred.user.uid), {
            nama: signupNama.trim(),
            email: signupEmail.trim(),
            role: 'Petugas',
            createdAt: Date.now()
          });

          setLoading(false);
          setAuthSuccess('🎉 Akun berhasil dibuat! Silakan masuk.');
          setLoginEmail(signupEmail.trim());
          setSignupNama('');
          setSignupEmail('');
          setSignupPassword('');
          setAuthMode('login');
        } catch (err) {
          setLoading(false);
          setAuthError('Gagal membuat akun: ' + err.message);
        }
      };

      const handleLogout = async () => {
        if (window.confirm('Yakin ingin keluar dari sistem?')) {
          const { signOut } = window.fbFS;
          await signOut(window.fbAuth);
          setCurrentUser(null);
        }
      };

      const handleChangeUserRole = async (targetUid, newRole) => {
        if (targetUid === currentUser.uid) {
          return alert("Anda tidak dapat mengubah role akun Anda sendiri!");
        }

        if (window.confirm(`Ubah role user ini menjadi "${newRole}"?`)) {
          setLoading(true);
          try {
            const { doc, updateDoc } = window.fbFS;
            await updateDoc(doc(window.fbDb, "users", targetUid), {
              role: newRole
            });
            setLoading(false);
            showToast('✅ Role pengguna berhasil diperbarui!');
          } catch (err) {
            setLoading(false);
            alert('Gagal mengubah role: ' + err.message);
          }
        }
      };

      const handleSavePemodal = async (e) => {
        e.preventDefault();
        const modalNominal = parseFloat(formPemodal.jumlahModal) || 0;
        if (!formPemodal.namaPemodal.trim() || modalNominal <= 0) {
          return alert('Nama Pemodal dan Jumlah Modal harus diisi dengan benar!');
        }

        setLoading(true);
        try {
          const { collection, addDoc } = window.fbFS;
          await addDoc(collection(window.fbDb, "pemodal"), {
            namaPemodal: formPemodal.namaPemodal.trim(),
            jumlahModal: modalNominal,
            tanggalBergabung: formPemodal.tanggalBergabung,
            kontak: formPemodal.kontak.trim() || '-',
            catatan: formPemodal.catatan.trim() || '-',
            createdAt: Date.now()
          });
          setLoading(false);
          showToast('🤝 Data Pemodal berhasil disimpan!');
          setFormPemodal({ namaPemodal: '', jumlahModal: '', tanggalBergabung: getTodayFormatted(), kontak: '', catatan: '' });
        } catch (err) {
          setLoading(false);
          alert('Gagal menyimpan pemodal: ' + err.message);
        }
      };

      const handleSaveWithdrawal = async (e) => {
        e.preventDefault();
        if (currentUser.role !== 'Admin') {
          return alert('Akses ditolak! Fitur ini hanya untuk Admin.');
        }

        const nominal = parseFloat(formWithdraw.jumlahTarik) || 0;
        if (!selectedPemodalWithdraw || nominal <= 0) return alert('Nominal penarikan harus > 0!');

        const totalTambah = additionList
          .filter(a => a.pemodalId === selectedPemodalWithdraw.id)
          .reduce((sum, a) => sum + (a.jumlahTambah || 0), 0);

        const existingWithdrawn = withdrawalList
          .filter(w => w.pemodalId === selectedPemodalWithdraw.id)
          .reduce((sum, w) => sum + (w.jumlahTarik || 0), 0);

        const sisaModalMax = selectedPemodalWithdraw.jumlahModal + totalTambah - existingWithdrawn;

        if (nominal > sisaModalMax) {
          return alert(`Jumlah penarikan (Rp ${nominal.toLocaleString()}) melebihi sisa modal aktif (Rp ${sisaModalMax.toLocaleString()})!`);
        }

        setLoading(true);
        try {
          const { collection, addDoc } = window.fbFS;
          await addDoc(collection(window.fbDb, "pemodal_withdrawals"), {
            pemodalId: selectedPemodalWithdraw.id,
            namaPemodal: selectedPemodalWithdraw.namaPemodal,
            tanggal: formWithdraw.tanggal,
            jumlahTarik: nominal,
            catatan: formWithdraw.catatan.trim() || '-',
            createdAt: Date.now()
          });
          setLoading(false);
          showToast('💸 Penarikan modal berhasil dicatat!');
          setSelectedPemodalWithdraw(null);
          setFormWithdraw({ tanggal: getTodayFormatted(), jumlahTarik: '', catatan: '' });
        } catch (err) {
          setLoading(false);
          alert('Gagal memproses penarikan modal: ' + err.message);
        }
      };

      const handleSaveAddition = async (e) => {
        e.preventDefault();
        if (currentUser.role !== 'Admin') {
          return alert('Akses ditolak! Fitur ini hanya untuk Admin.');
        }

        const nominal = parseFloat(formAddModal.jumlahTambah) || 0;
        if (!selectedPemodalAdd || nominal <= 0) return alert('Nominal penambahan modal harus > 0!');

        setLoading(true);
        try {
          const { collection, addDoc } = window.fbFS;
          await addDoc(collection(window.fbDb, "pemodal_additions"), {
            pemodalId: selectedPemodalAdd.id,
            namaPemodal: selectedPemodalAdd.namaPemodal,
            tanggal: formAddModal.tanggal,
            jumlahTambah: nominal,
            catatan: formAddModal.catatan.trim() || '-',
            createdAt: Date.now()
          });
          setLoading(false);
          showToast('➕ Penambahan modal berhasil dicatat!');
          setSelectedPemodalAdd(null);
          setFormAddModal({ tanggal: getTodayFormatted(), jumlahTambah: '', catatan: '' });
        } catch (err) {
          setLoading(false);
          alert('Gagal menambah modal: ' + err.message);
        }
      };

      const handleDeleteWithdrawal = async (id) => {
        if (currentUser.role !== 'Admin') {
          return alert('Akses ditolak! Fitur ini hanya untuk Admin.');
        }

        if (window.confirm('Batalkan / Hapus data penarikan modal ini?')) {
          setLoading(true);
          try {
            const { doc, deleteDoc } = window.fbFS;
            await deleteDoc(doc(window.fbDb, "pemodal_withdrawals", id));
            setLoading(false);
            showToast('🗑️ Penarikan modal dibatalkan!');
          } catch (err) {
            setLoading(false);
            alert('Gagal menghapus data penarikan modal!');
          }
        }
      };

      const handleDeleteAddition = async (id) => {
        if (currentUser.role !== 'Admin') {
          return alert('Akses ditolak! Fitur ini hanya untuk Admin.');
        }

        if (window.confirm('Batalkan / Hapus data penambahan modal ini?')) {
          setLoading(true);
          try {
            const { doc, deleteDoc } = window.fbFS;
            await deleteDoc(doc(window.fbDb, "pemodal_additions", id));
            setLoading(false);
            showToast('🗑️ Penambahan modal dibatalkan!');
          } catch (err) {
            setLoading(false);
            alert('Gagal menghapus data penambahan modal!');
          }
        }
      };

      const handleDeletePemodal = async (id) => {
        if (currentUser.role !== 'Admin') {
          return alert('Akses ditolak! Fitur ini hanya untuk Admin.');
        }

        if (window.confirm('Hapus data pemodal ini dari Firestore? (Riwayat penarikan & penambahan modal terkait akan terpengaruh)')) {
          setLoading(true);
          try {
            const { doc, deleteDoc } = window.fbFS;
            await deleteDoc(doc(window.fbDb, "pemodal", id));
            setLoading(false);
            showToast('🗑️ Pemodal dihapus!');
          } catch (err) {
            setLoading(false);
            alert('Gagal menghapus data pemodal!');
          }
        }
      };

      const handleAddCategory = async (e) => {
        e.preventDefault();
        if (!newCatCode.trim() || !newCatName.trim()) return alert('Kode dan Nama Kategori harus diisi!');

        setLoading(true);
        try {
          const { collection, addDoc } = window.fbFS;
          await addDoc(collection(window.fbDb, "categories"), {
            code: newCatCode.trim().toUpperCase(),
            name: newCatName.trim(),
            createdAt: Date.now()
          });
          setLoading(false);
          showToast('✅ Kategori baru berhasil ditambahkan!');
          setNewCatCode('');
          setNewCatName('');
        } catch (err) {
          setLoading(false);
          alert('Gagal menambah kategori: ' + err.message);
        }
      };

      const handleDeleteCategory = async (id) => {
        if (window.confirm('Hapus kategori barang ini?')) {
          setLoading(true);
          try {
            const { doc, deleteDoc } = window.fbFS;
            await deleteDoc(doc(window.fbDb, "categories", id));
            setLoading(false);
            showToast('🗑️ Kategori dihapus!');
          } catch (err) {
            setLoading(false);
            alert('Gagal menghapus kategori!');
          }
        }
      };

      const [formAmbil, setFormAmbil] = useState({
        tanggal: getTodayFormatted(),
        pengambilSelect: '',
        tempatAmbil: '',
        lokasiAmbil: '',
        kategoriCode: 'A',
        jumlahKotor: '',
        hargaBeliSatuan: '',
        biayaTransport: ''
      });

      const [formOlah, setFormOlah] = useState({
        selectedTrxIds: [],
        tanggalOlah: getTodayFormatted(),
        pengolahSelect: '',
        jumlahMurni: '',
        biayaOlah: ''
      });

      const [formJual, setFormJual] = useState({
        selectedTrxIds: [],
        tanggalJual: getTodayFormatted(),
        hargaJualSatuan: '',
        biayaPenjualan: ''
      });

      const handleSavePengambilan = async (e) => {
        e.preventDefault();
        setLoading(true);

        const kotor = parseFloat(formAmbil.jumlahKotor) || 0;
        const hargaBeli = parseFloat(formAmbil.hargaBeliSatuan) || 0;
        const transport = parseFloat(formAmbil.biayaTransport) || 0;
        const selectedCat = categories.find(c => c.code === formAmbil.kategoriCode) || categories[0] || { code: 'A', name: 'Umum' };

        const payload = {
          codeId: 'TRX-' + Math.floor(1000 + Math.random() * 9000),
          tanggalAmbil: formAmbil.tanggal,
          kategoriName: `[${selectedCat.code}] ${selectedCat.name}`,
          pengambil: formAmbil.pengambilSelect || currentUser.nama,
          tempatAmbil: formAmbil.tempatAmbil,
          lokasiAmbil: formAmbil.lokasiAmbil,
          jumlahKotor: kotor,
          hargaBeliSatuan: hargaBeli,
          totalBeli: kotor * hargaBeli,
          biayaTransport: transport,
          pengolah: '-',
          jumlahMurni: 0,
          biayaOlah: 0,
          efisiensi: 0,
          tanggalOlah: '',
          tanggalPenjualan: '',
          tokoPembeli: '-',
          jumlahJual: 0,
          hargaJualSatuan: 0,
          totalJual: 0,
          biayaPenjualan: 0,
          totalUntung: 0,
          status: 'MENUNGGU_OLAH',
          createdAt: Date.now()
        };

        try {
          const { collection, addDoc } = window.fbFS;
          await addDoc(collection(window.fbDb, "transactions"), payload);
          setLoading(false);
          showToast('🎉 Pembelian baru tersimpan di Firebase!');
          setFormAmbil({ ...formAmbil, tempatAmbil: '', lokasiAmbil: '', jumlahKotor: '', hargaBeliSatuan: '', biayaTransport: '', pengambilSelect: currentUser ? currentUser.nama : '' });
          setActiveTab('dashboard');
        } catch (err) {
          setLoading(false);
          alert('Gagal menyimpan data: ' + err.message);
        }
      };

      const handleToggleSelectOlah = (id) => {
        const current = formOlah.selectedTrxIds;
        if (current.includes(id)) setFormOlah({ ...formOlah, selectedTrxIds: current.filter(x => x !== id) });
        else setFormOlah({ ...formOlah, selectedTrxIds: [...current, id] });
      };

      const handleToggleSelectJual = (id) => {
        const current = formJual.selectedTrxIds;
        if (current.includes(id)) setFormJual({ ...formJual, selectedTrxIds: current.filter(x => x !== id) });
        else setFormJual({ ...formJual, selectedTrxIds: [...current, id] });
      };

      const selectedTrxOlahList = transactions.filter(t => formOlah.selectedTrxIds.includes(t.id));
      const totalKotorSelected = selectedTrxOlahList.reduce((sum, t) => sum + t.jumlahKotor, 0);

      const murniVal = parseFloat(formOlah.jumlahMurni) || 0;
      const totalBiayaOlahVal = parseFloat(formOlah.biayaOlah) || 0;

      const handleSavePengolahan = async (e) => {
        e.preventDefault();
        if (formOlah.selectedTrxIds.length === 0) return alert('Pilih minimal 1 transaksi!');
        if (murniVal <= 0) return alert('Hasil Perak Murni harus > 0!');

        setLoading(true);
        const { doc, updateDoc } = window.fbFS;

        try {
          for (let t of selectedTrxOlahList) {
            const porsiGram = t.jumlahKotor / totalKotorSelected;
            const murniItem = parseFloat((murniVal * porsiGram).toFixed(2));
            const biayaItem = parseFloat((totalBiayaOlahVal * porsiGram).toFixed(0));
            const efisiensiItem = parseFloat(((murniItem / t.jumlahKotor) * 100).toFixed(2));

            const docRef = doc(window.fbDb, "transactions", t.id);
            await updateDoc(docRef, {
              tanggalOlah: formOlah.tanggalOlah,
              pengolah: (formOlah.pengolahSelect || currentUser.nama).trim(),
              jumlahMurni: murniItem,
              biayaOlah: biayaItem,
              efisiensi: efisiensiItem,
              status: 'SELESAI_OLAH'
            });
          }

          setLoading(false);
          showToast('🧪 Data Pemurnian berhasil di-update!');
          setFormOlah({ selectedTrxIds: [], tanggalOlah: getTodayFormatted(), pengolahSelect: currentUser ? currentUser.nama : '', jumlahMurni: '', biayaOlah: '' });
          setActiveTab('dashboard');
        } catch (err) {
          setLoading(false);
          alert('Gagal update pemurnian: ' + err.message);
        }
      };

      const selectedTrxJualList = transactions.filter(t => formJual.selectedTrxIds.includes(t.id));
      const totalMurniJualSelected = selectedTrxJualList.reduce((sum, t) => sum + t.jumlahMurni, 0);
      const hargaJualVal = parseFloat(formJual.hargaJualSatuan) || 0;
      const totalBiayaPenjualanVal = parseFloat(formJual.biayaPenjualan) || 0;

      const handleSavePenjualan = async (e) => {
        e.preventDefault();
        if (formJual.selectedTrxIds.length === 0) return alert('Pilih minimal 1 barang!');
        if (hargaJualVal <= 0) return alert('Harga jual per gram harus > 0!');

        setLoading(true);
        const { doc, updateDoc } = window.fbFS;

        try {
          for (let t of selectedTrxJualList) {
            const porsiMurni = t.jumlahMurni / totalMurniJualSelected;
            const totalJualItem = parseFloat((t.jumlahMurni * hargaJualVal).toFixed(0));
            const biayaPenjualanItem = parseFloat((totalBiayaPenjualanVal * porsiMurni).toFixed(0));
            const totalUntungItem = totalJualItem - t.totalBeli - t.biayaTransport - t.biayaOlah - biayaPenjualanItem;

            const docRef = doc(window.fbDb, "transactions", t.id);
            await updateDoc(docRef, {
              tanggalPenjualan: formJual.tanggalJual,
              jumlahJual: t.jumlahMurni,
              hargaJualSatuan: hargaJualVal,
              totalJual: totalJualItem,
              tokoPembeli: currentUser.nama,
              biayaPenjualan: biayaPenjualanItem,
              totalUntung: totalUntungItem,
              status: 'TERJUAL'
            });
          }

          setLoading(false);
          showToast('💰 Data Penjualan berhasil dicatat!');
          setFormJual({ selectedTrxIds: [], tanggalJual: getTodayFormatted(), hargaJualSatuan: '', biayaPenjualan: '' });
          setActiveTab('dashboard');
        } catch (err) {
          setLoading(false);
          alert('Gagal update penjualan: ' + err.message);
        }
      };

      const handleDeleteTransaction = async (id) => {
        if (window.confirm(`Hapus transaksi ini dari Firebase?`)) {
          setLoading(true);
          try {
            const { doc, deleteDoc } = window.fbFS;
            await deleteDoc(doc(window.fbDb, "transactions", id));
            setLoading(false);
            showToast('🗑️ Transaksi berhasil dihapus!');
          } catch (err) {
            setLoading(false);
            alert('Gagal menghapus data!');
          }
        }
      };

      // FILTER LAPORAN UTAMA
      const filteredTransactions = transactions.filter(t => {
        const term = searchTerm.toLowerCase();
        const matchSearch = (
          (t.codeId || '').toLowerCase().includes(term) ||
          (t.kategoriName || '').toLowerCase().includes(term) ||
          (t.pengambil || '').toLowerCase().includes(term) ||
          (t.tempatAmbil || '').toLowerCase().includes(term) ||
          (t.pengolah || '').toLowerCase().includes(term) ||
          (t.tokoPembeli || '').toLowerCase().includes(term)
        );
        if (!matchSearch) return false;

        let targetDate = '';
        if (reportFilterBy === 'PEMBELIAN') targetDate = t.tanggalAmbil;
        else if (reportFilterBy === 'PENGOLAHAN') targetDate = t.tanggalOlah;
        else if (reportFilterBy === 'PENJUALAN') targetDate = t.tanggalPenjualan;

        if (!targetDate || targetDate === '-') {
          if (reportFilterType !== 'ALL') return false;
        }

        if (reportFilterType === 'MONTH') {
          if (!reportFilterMonth || !targetDate) return true;
          return targetDate.startsWith(reportFilterMonth);
        } else if (reportFilterType === 'RANGE') {
          if (!targetDate) return false;
          if (reportStartDate && targetDate < reportStartDate) return false;
          if (reportEndDate && targetDate > reportEndDate) return false;
          return true;
        }

        return true;
      });

      const totalBarangKotor = filteredTransactions.reduce((acc, t) => acc + (t.jumlahKotor || 0), 0);
      const totalPerakMurni = filteredTransactions.reduce((acc, t) => acc + (t.jumlahMurni || 0), 0);
      const totalBeliModal = filteredTransactions.reduce((acc, t) => acc + (t.totalBeli || 0), 0);
      const totalOmsetPenjualan = filteredTransactions.filter(t => t.status === 'TERJUAL').reduce((acc, t) => acc + (t.totalJual || 0), 0);
      const totalLabaBersih = filteredTransactions.filter(t => t.status === 'TERJUAL').reduce((acc, t) => acc + (t.totalUntung || 0), 0);

      // AKUMULASI AKTIVITAS DAN BIAYA MASING-MASING USER
      const userActivityStats = (() => {
        const statsMap = {};

        filteredTransactions.forEach(t => {
          // 1. Aktivitas Pembelian (PIC Pengambil)
          if (t.pengambil && t.pengambil !== '-') {
            if (!statsMap[t.pengambil]) {
              statsMap[t.pengambil] = {
                nama: t.pengambil,
                beliCount: 0, beliGram: 0, beliTotalModal: 0, beliTransport: 0,
                olahCount: 0, olahMurniGram: 0, olahBiaya: 0,
                jualCount: 0, jualMurniGram: 0, jualOmset: 0, jualBiaya: 0
              };
            }
            statsMap[t.pengambil].beliCount += 1;
            statsMap[t.pengambil].beliGram += (t.jumlahKotor || 0);
            statsMap[t.pengambil].beliTotalModal += (t.totalBeli || 0);
            statsMap[t.pengambil].beliTransport += (t.biayaTransport || 0);
          }

          // 2. Aktivitas Pengolahan (PIC Pengolah)
          if (t.pengolah && t.pengolah !== '-') {
            if (!statsMap[t.pengolah]) {
              statsMap[t.pengolah] = {
                nama: t.pengolah,
                beliCount: 0, beliGram: 0, beliTotalModal: 0, beliTransport: 0,
                olahCount: 0, olahMurniGram: 0, olahBiaya: 0,
                jualCount: 0, jualMurniGram: 0, jualOmset: 0, jualBiaya: 0
              };
            }
            statsMap[t.pengolah].olahCount += 1;
            statsMap[t.pengolah].olahMurniGram += (t.jumlahMurni || 0);
            statsMap[t.pengolah].olahBiaya += (t.biayaOlah || 0);
          }

          // 3. Aktivitas Penjualan (PIC Penjual / Toko Pembeli)
          if (t.tokoPembeli && t.tokoPembeli !== '-' && t.status === 'TERJUAL') {
            if (!statsMap[t.tokoPembeli]) {
              statsMap[t.tokoPembeli] = {
                nama: t.tokoPembeli,
                beliCount: 0, beliGram: 0, beliTotalModal: 0, beliTransport: 0,
                olahCount: 0, olahMurniGram: 0, olahBiaya: 0,
                jualCount: 0, jualMurniGram: 0, jualOmset: 0, jualBiaya: 0
              };
            }
            statsMap[t.tokoPembeli].jualCount += 1;
            statsMap[t.tokoPembeli].jualMurniGram += (t.jumlahMurni || 0);
            statsMap[t.tokoPembeli].jualOmset += (t.totalJual || 0);
            statsMap[t.tokoPembeli].jualBiaya += (t.biayaPenjualan || 0);
          }
        });

        return Object.values(statsMap);
      })();

      // FILTER KHUSUS PEMODAL DENGAN ACUAN TANGGAL PENJUALAN
      const pemodalFilteredTransactions = transactions.filter(t => {
        if (t.status !== 'TERJUAL') return false;
        const tJualDate = t.tanggalPenjualan;

        if (!tJualDate || tJualDate === '-') return false;

        if (pemodalFilterType === 'MONTH') {
          if (!pemodalFilterMonth) return true;
          return tJualDate.startsWith(pemodalFilterMonth);
        } else if (pemodalFilterType === 'RANGE') {
          if (pemodalStartDate && tJualDate < pemodalStartDate) return false;
          if (pemodalEndDate && tJualDate > pemodalEndDate) return false;
          return true;
        }
        return true;
      });

      const pemodalTotalLabaPeriod = pemodalFilteredTransactions.reduce((acc, t) => acc + (t.totalUntung || 0), 0);
      
      // HITUNG TOTAL MODAL INVESTOR AKTIF DENGAN PENAMBAHAN & PENARIKAN
      const totalModalAwalSetor = pemodalList.reduce((acc, p) => acc + (p.jumlahModal || 0), 0);
      const totalPenambahanModalAll = additionList.reduce((acc, a) => acc + (a.jumlahTambah || 0), 0);
      const totalPenarikanModalAll = withdrawalList.reduce((acc, w) => acc + (w.jumlahTarik || 0), 0);
      const totalModalDisetorBruto = totalModalAwalSetor + totalPenambahanModalAll;
      const totalModalAktifNet = totalModalDisetorBruto - totalPenarikanModalAll;

      const bagianPengelolaNominal = (pemodalTotalLabaPeriod * nisbahPengelolaPct) / 100;
      const totalLabaUntukPemodal = pemodalTotalLabaPeriod - bagianPengelolaNominal;

      // KALKULASI ARUS KAS & NERACA
      const neracaFilteredTransactions = transactions.filter(t => {
        const tDate = t.tanggalPenjualan || t.tanggalOlah || t.tanggalAmbil;

        if (neracaFilterType === 'MONTH') {
          if (!neracaFilterMonth || !tDate) return true;
          return tDate.startsWith(neracaFilterMonth);
        } else if (neracaFilterType === 'RANGE') {
          if (!tDate) return false;
          if (neracaStartDate && tDate < neracaStartDate) return false;
          if (neracaEndDate && tDate > neracaEndDate) return false;
          return true;
        }
        return true;
      });

      const filteredPemodalList = pemodalList.filter(p => {
        const pDate = p.tanggalBergabung;
        if (neracaFilterType === 'MONTH') {
          if (!neracaFilterMonth || !pDate) return true;
          return pDate.startsWith(neracaFilterMonth);
        } else if (neracaFilterType === 'RANGE') {
          if (!pDate) return false;
          if (neracaStartDate && pDate < neracaStartDate) return false;
          if (neracaEndDate && pDate > neracaEndDate) return false;
          return true;
        }
        return true;
      });

      const filteredWithdrawalList = withdrawalList.filter(w => {
        const wDate = w.tanggal;
        if (neracaFilterType === 'MONTH') {
          if (!neracaFilterMonth || !wDate) return true;
          return wDate.startsWith(neracaFilterMonth);
        } else if (neracaFilterType === 'RANGE') {
          if (!wDate) return false;
          if (neracaStartDate && wDate < neracaStartDate) return false;
          if (neracaEndDate && wDate > neracaEndDate) return false;
          return true;
        }
        return true;
      });

      const filteredAdditionList = additionList.filter(a => {
        const aDate = a.tanggal;
        if (neracaFilterType === 'MONTH') {
          if (!neracaFilterMonth || !aDate) return true;
          return aDate.startsWith(neracaFilterMonth);
        } else if (neracaFilterType === 'RANGE') {
          if (!aDate) return false;
          if (neracaStartDate && aDate < neracaStartDate) return false;
          if (neracaEndDate && aDate > neracaEndDate) return false;
          return true;
        }
        return true;
      });

      const totalModalInvestorAwalPeriod = filteredPemodalList.reduce((acc, p) => acc + (p.jumlahModal || 0), 0);
      const totalModalInvestorTambahPeriod = filteredAdditionList.reduce((acc, a) => acc + (a.jumlahTambah || 0), 0);
      const totalModalInvestorPeriod = totalModalInvestorAwalPeriod + totalModalInvestorTambahPeriod;

      const totalKasMasukPenjualan = neracaFilteredTransactions.reduce((acc, t) => acc + (t.totalJual || 0), 0);
      const totalKasMasukKeseluruhan = totalModalInvestorPeriod + totalKasMasukPenjualan;

      const totalBiayaOperasionalTrx = neracaFilteredTransactions.reduce((acc, t) => {
        return acc + (t.totalBeli || 0) + (t.biayaTransport || 0) + (t.biayaOlah || 0) + (t.biayaPenjualan || 0);
      }, 0);
      const totalKasKeluarWithdraw = filteredWithdrawalList.reduce((acc, w) => acc + (w.jumlahTarik || 0), 0);

      const totalKasKeluar = totalBiayaOperasionalTrx + totalKasKeluarWithdraw;

      const saldoKasNet = totalKasMasukKeseluruhan - totalKasKeluar;

      const pendingOlahList = transactions.filter(t => t.status === 'MENUNGGU_OLAH');
      const pendingJualList = transactions.filter(t => t.status === 'SELESAI_OLAH');

      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-6 sm:p-8 border border-slate-800">
              <div className="text-center mb-6">
                <div className="inline-block bg-amber-500 text-slate-900 p-3 rounded-2xl font-black text-3xl mb-2">Ag</div>
                <h2 className="text-2xl font-bold text-slate-800">Refining Perak System</h2>
                <p className="text-xs text-slate-500 mt-1">🔥 Powered by Firebase Cloud</p>
              </div>

              <div className="flex bg-slate-100 p-1 rounded-xl mb-6">
                <button
                  onClick={() => { setAuthMode('login'); setAuthError(''); setAuthSuccess(''); }}
                  className={`flex-1 py-2.5 text-xs font-bold rounded-lg transition ${
                    authMode === 'login' ? 'bg-amber-500 text-slate-900 shadow' : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  Masuk (Sign In)
                </button>
                <button
                  onClick={() => { setAuthMode('signup'); setAuthError(''); setAuthSuccess(''); }}
                  className={`flex-1 py-2.5 text-xs font-bold rounded-lg transition ${
                    authMode === 'signup' ? 'bg-amber-500 text-slate-900 shadow' : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  Daftar (Sign Up)
                </button>
              </div>

              {authError && (
                <div className="bg-red-50 border border-red-200 text-red-600 px-4 py-2.5 rounded-lg text-xs font-semibold mb-4">
                  ⚠️ {authError}
                </div>
              )}

              {authSuccess && (
                <div className="bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-2.5 rounded-lg text-xs font-semibold mb-4">
                  {authSuccess}
                </div>
              )}

              {authMode === 'login' && (
                <form onSubmit={handleLoginSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Email</label>
                    <input
                      type="email"
                      required
                      placeholder="e.g. user@perak.com"
                      value={loginEmail}
                      onChange={(e) => setLoginEmail(e.target.value)}
                      className="w-full px-4 py-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                    <input
                      type="password"
                      required
                      placeholder="Masukkan password"
                      value={loginPassword}
                      onChange={(e) => setLoginPassword(e.target.value)}
                      className="w-full px-4 py-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500"
                    />
                  </div>
                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3.5 rounded-xl shadow-lg transition active:scale-95"
                  >
                    {loading ? 'Memproses...' : 'Masuk Ke Sistem ➔'}
                  </button>
                </form>
              )}

              {authMode === 'signup' && (
                <form onSubmit={handleSignUpSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Lengkap</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Reva Surya"
                      value={signupNama}
                      onChange={(e) => setSignupNama(e.target.value)}
                      className="w-full px-4 py-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Email Baru</label>
                    <input
                      type="email"
                      required
                      placeholder="e.g. reva@perak.com"
                      value={signupEmail}
                      onChange={(e) => setSignupEmail(e.target.value)}
                      className="w-full px-4 py-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Password Baru</label>
                    <input
                      type="password"
                      required
                      placeholder="Minimal 6 karakter"
                      value={signupPassword}
                      onChange={(e) => setSignupPassword(e.target.value)}
                      className="w-full px-4 py-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500"
                    />
                  </div>
                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition active:scale-95"
                  >
                    {loading ? 'Mendaftarkan...' : 'Daftar Akun Baru ➔'}
                  </button>
                </form>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 font-sans relative pb-12">
          {toastMsg && (
            <div className="fixed bottom-5 left-4 right-4 sm:left-auto sm:right-5 z-50 bg-slate-900 text-emerald-400 border border-emerald-500 px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between gap-3 animate-bounce">
              <div className="flex items-center gap-2">
                <span className="text-lg">✨</span>
                <p className="text-xs font-bold">{toastMsg}</p>
              </div>
            </div>
          )}

          {loading && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white px-4 text-center">
              <div className="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-3"></div>
              <p className="text-sm font-bold tracking-wider">Menghubungkan ke Firebase Cloud...</p>
            </div>
          )}

          {/* MODAL FORM PENARIKAN MODAL */}
          {selectedPemodalWithdraw && currentUser.role === 'Admin' && (
            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full overflow-hidden animate-in slide-in-from-bottom sm:slide-in-from-none duration-200">
                <div className="bg-slate-900 text-white p-4 sm:p-5 flex justify-between items-center">
                  <div>
                    <h3 className="font-bold text-sm text-amber-400">💸 Penarikan Modal Investor</h3>
                    <p className="text-xs text-slate-300 font-semibold">{selectedPemodalWithdraw.namaPemodal}</p>
                  </div>
                  <button 
                    onClick={() => setSelectedPemodalWithdraw(null)}
                    className="text-slate-400 hover:text-white p-2 text-xl font-bold"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveWithdrawal} className="p-4 sm:p-6 space-y-4 max-h-[85vh] overflow-y-auto">
                  {(() => {
                    const totalTambah = additionList
                      .filter(a => a.pemodalId === selectedPemodalWithdraw.id)
                      .reduce((s, a) => s + (a.jumlahTambah || 0), 0);

                    const totalWD = withdrawalList
                      .filter(w => w.pemodalId === selectedPemodalWithdraw.id)
                      .reduce((s, w) => s + (w.jumlahTarik || 0), 0);

                    const totalDisetor = selectedPemodalWithdraw.jumlahModal + totalTambah;
                    const sisaModal = totalDisetor - totalWD;

                    return (
                      <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl space-y-1">
                        <div className="flex justify-between text-xs">
                          <span className="text-slate-500 font-medium">Total Modal Disetor:</span>
                          <span className="font-bold text-slate-800">{formatRupiah(totalDisetor)}</span>
                        </div>
                        <div className="flex justify-between text-xs">
                          <span className="text-slate-500 font-medium">Total Pernah Ditarik:</span>
                          <span className="font-bold text-red-600">-{formatRupiah(totalWD)}</span>
                        </div>
                        <div className="flex justify-between text-xs border-t border-amber-200 pt-1 mt-1">
                          <span className="text-slate-700 font-bold">Sisa Modal Aktif:</span>
                          <span className="font-black text-emerald-700">{formatRupiah(sisaModal)}</span>
                        </div>
                      </div>
                    );
                  })()}

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Tanggal Penarikan</label>
                    <input 
                      type="date" 
                      required 
                      value={formWithdraw.tanggal} 
                      onChange={(e) => setFormWithdraw({ ...formWithdraw, tanggal: e.target.value })} 
                      className="w-full px-3 py-2.5 border rounded-xl text-sm bg-white" 
                    />

                    </div>
                  </div>

                  <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow active:scale-95">
                    Simpan Pemurnian ➔
                  </button>
                </form>
              </div>
            )}

            {/* TAB 3: PENJUALAN */}
            {activeTab === 'penjualan' && (
              <div className="max-w-3xl mx-auto bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
                <div className="bg-slate-900 text-white p-4 sm:p-6">
                  <h2 className="text-base sm:text-lg font-bold">💰 Input Penjualan Perak Murni</h2>
                  <p className="text-xs text-slate-400 mt-1">Petugas: <span className="text-amber-400 font-bold">{currentUser.nama}</span></p>
                </div>
                <form onSubmit={handleSavePenjualan} className="p-4 sm:p-6 space-y-4 sm:space-y-6">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-2">
                      Pilih Perak Siap Jual ({formJual.selectedTrxIds.length} Dipilih)
                    </label>
                    {pendingJualList.length === 0 ? (
                      <div className="p-4 bg-slate-50 border rounded-xl text-xs text-slate-500 text-center">
                        Tidak ada barang siap dijual.
                      </div>
                    ) : (
                      <div className="max-h-56 overflow-y-auto border border-slate-200 rounded-xl divide-y divide-slate-100">
                        {pendingJualList.map((t) => {
                          const isChecked = formJual.selectedTrxIds.includes(t.id);
                          return (
                            <label key={t.id} className={`flex items-center justify-between p-3 cursor-pointer transition ${isChecked ? 'bg-emerald-50' : ''}`}>
                              <div className="flex items-center gap-3">
                                <input type="checkbox" checked={isChecked} onChange={() => handleToggleSelectJual(t.id)} className="w-5 h-5 text-emerald-600 rounded" />
                                <div>
                                  <p className="font-bold text-xs text-slate-800">{t.codeId} - {t.kategoriName}</p>
                                  <p className="text-[10px] text-slate-500">Olah: {t.pengolah}</p>
                                </div>
                              </div>
                              <span className="font-mono font-bold text-xs text-blue-600">{t.jumlahMurni}g</span>
                            </label>
                          );
                        })}
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Tanggal Jual</label>
                      <input type="date" required value={formJual.tanggalJual} onChange={(e) => setFormJual({ ...formJual, tanggalJual: e.target.value })} className="w-full px-3 py-2.5 border rounded-xl text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Harga Jual / Gram (Rp)</label>
                      <input type="number" inputMode="numeric" required value={formJual.hargaJualSatuan} onChange={(e) => setFormJual({ ...formJual, hargaJualSatuan: e.target.value })} className="w-full px-3 py-2.5 border rounded-xl text-sm font-bold text-emerald-700" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Biaya Penjualan (Rp)</label>
                    <input type="number" inputMode="numeric" placeholder="e.g. 50000" value={formJual.biayaPenjualan} onChange={(e) => setFormJual({ ...formJual, biayaPenjualan: e.target.value })} className="w-full px-3 py-2.5 border rounded-xl text-sm" />
                  </div>

                  <button type="submit" disabled={loading} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow active:scale-95">
                    Selesaikan Penjualan ➔
                  </button>
                </form>
              </div>
            )}

            {/* TAB 4: LAPORAN & METRIK REALTIME */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4 sm:space-y-6">
                <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                  <div className="flex flex-col gap-2 pb-2 border-b border-slate-100">
                    <h3 className="font-bold text-slate-800 text-sm">🔍 Filter Laporan</h3>
                    
                    <div className="grid grid-cols-3 bg-slate-100 p-1 rounded-xl text-center">
                      <button
                        onClick={() => setReportFilterBy('PEMBELIAN')}
                        className={`py-1.5 text-[10px] sm:text-xs font-bold rounded-lg transition ${
                          reportFilterBy === 'PEMBELIAN' ? 'bg-slate-900 text-amber-400 shadow' : 'text-slate-600'
                        }`}
                      >
                        Pembelian
                      </button>
                      <button
                        onClick={() => setReportFilterBy('PENGOLAHAN')}
                        className={`py-1.5 text-[10px] sm:text-xs font-bold rounded-lg transition ${
                          reportFilterBy === 'PENGOLAHAN' ? 'bg-slate-900 text-blue-400 shadow' : 'text-slate-600'
                        }`}
                      >
                        Pengolahan
                      </button>
                      <button
                        onClick={() => setReportFilterBy('PENJUALAN')}
                        className={`py-1.5 text-[10px] sm:text-xs font-bold rounded-lg transition ${
                          reportFilterBy === 'PENJUALAN' ? 'bg-slate-900 text-emerald-400 shadow' : 'text-slate-600'
                        }`}
                      >
                        Penjualan
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 bg-slate-100 p-1 rounded-xl text-center">
                    <button
                      onClick={() => setReportFilterType('ALL')}
                      className={`py-1.5 text-xs font-bold rounded-lg transition ${
                        reportFilterType === 'ALL' ? 'bg-amber-500 text-slate-900 shadow' : 'text-slate-600'
                      }`}
                    >
                      Semua
                    </button>
                    <button
                      onClick={() => setReportFilterType('MONTH')}
                      className={`py-1.5 text-xs font-bold rounded-lg transition ${
                        reportFilterType === 'MONTH' ? 'bg-amber-500 text-slate-900 shadow' : 'text-slate-600'
                      }`}
                    >
                      Bulanan
                    </button>
                    <button
                      onClick={() => setReportFilterType('RANGE')}
                      className={`py-1.5 text-xs font-bold rounded-lg transition ${
                        reportFilterType === 'RANGE' ? 'bg-amber-500 text-slate-900 shadow' : 'text-slate-600'
                      }`}
                    >
                      Rentang
                    </button>
                  </div>

                  {reportFilterType === 'MONTH' && (
                    <input
                      type="month"
                      value={reportFilterMonth}
                      onChange={(e) => setReportFilterMonth(e.target.value)}
                      className="w-full px-3 py-1.5 border rounded-lg text-xs font-bold text-slate-800 bg-white"
                    />
                  )}

                  {reportFilterType === 'RANGE' && (
                    <div className="grid grid-cols-2 gap-2">
                      <input
                        type="date"
                        value={reportStartDate}
                        onChange={(e) => setReportStartDate(e.target.value)}
                        className="w-full px-2 py-1.5 border rounded-lg text-xs font-bold text-slate-800 bg-white"
                      />
                      <input
                        type="date"
                        value={reportEndDate}
                        onChange={(e) => setReportEndDate(e.target.value)}
                        className="w-full px-2 py-1.5 border rounded-lg text-xs font-bold text-slate-800 bg-white"
                      />
                    </div>
                  )}
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div className="bg-white p-3.5 sm:p-5 rounded-2xl shadow-sm border border-slate-200">
                    <span className="text-[10px] font-semibold text-slate-400 uppercase">Barang Mentah</span>
                    <p className="text-base sm:text-2xl font-black text-slate-800 mt-0.5">{totalBarangKotor.toFixed(2)}g</p>
                    <span className="text-[10px] text-slate-500 block">Beli: {formatRupiah(totalBeliModal)}</span>
                  </div>
                  <div className="bg-white p-3.5 sm:p-5 rounded-2xl shadow-sm border border-slate-200">
                    <span className="text-[10px] font-semibold text-slate-400 uppercase">Perak Murni</span>
                    <p className="text-base sm:text-2xl font-black text-blue-600 mt-0.5">{totalPerakMurni.toFixed(2)}g</p>
                  </div>
                  <div className="bg-white p-3.5 sm:p-5 rounded-2xl shadow-sm border border-slate-200">
                    <span className="text-[10px] font-semibold text-slate-400 uppercase">Omset Jual</span>
                    <p className="text-base sm:text-2xl font-black text-emerald-600 mt-0.5">{formatRupiah(totalOmsetPenjualan)}</p>
                  </div>
                  <div className="bg-white p-3.5 sm:p-5 rounded-2xl shadow-sm border border-slate-200">
                    <span className="text-[10px] font-semibold text-slate-400 uppercase">Laba Bersih</span>
                    <p className="text-base sm:text-2xl font-black text-amber-600 mt-0.5">{formatRupiah(totalLabaBersih)}</p>
                  </div>
                </div>

                {/* RINGKASAN AKTIVITAS BIAYA SEKERJA MASING-MASING USER */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="p-4 border-b border-slate-200 bg-slate-900 text-white">
                    <h3 className="font-bold text-xs sm:text-sm text-amber-400">👤 Ringkasan Aktivitas & Biaya Per User / PIC</h3>
                    <p className="text-[10px] text-slate-300 mt-0.5">Rincian beban biaya pembelian, pengolahan, dan omset penjualan per petugas.</p>
                  </div>

                  <div className="p-3 sm:p-5 space-y-3">
                    {userActivityStats.length === 0 ? (
                      <p className="text-center py-4 text-xs text-slate-400">Belum ada data aktivitas user pada periode ini.</p>
                    ) : (
                      userActivityStats.map((u, idx) => {
                        const totalBiayaUserBeli = u.beliTotalModal + u.beliTransport;

                        return (
                          <div key={idx} className="p-3.5 bg-slate-50 border border-slate-200 rounded-2xl space-y-2 text-xs">
                            <div className="flex justify-between items-center border-b border-slate-200 pb-2">
                              <span className="font-bold text-sm text-slate-900">👤 {u.nama}</span>
                              <span className="text-[10px] bg-slate-200 text-slate-700 font-extrabold px-2 py-0.5 rounded-full">
                                Active User
                              </span>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                              {/* AKSI PEMBELIAN */}
                              <div className="bg-amber-50/70 p-2.5 rounded-xl border border-amber-200/80 space-y-1">
                                <span className="font-bold text-[11px] text-amber-900 block border-b border-amber-200/60 pb-1">
                                  📥 Pembelian ({u.beliCount} Trx)
                                </span>
                                <div className="flex justify-between text-[10px]">
                                  <span className="text-slate-500">Volume Kotor:</span>
                                  <span className="font-bold text-slate-800 font-mono">{u.beliGram.toFixed(2)}g</span>
                                </div>
                                <div className="flex justify-between text-[10px]">
                                  <span className="text-slate-500">Modal Beli:</span>
                                  <span className="font-bold text-slate-800 font-mono">{formatRupiah(u.beliTotalModal)}</span>
                                </div>
                                <div className="flex justify-between text-[10px]">
                                  <span className="text-slate-500">Biaya Transport:</span>
                                  <span className="font-bold text-slate-800 font-mono">{formatRupiah(u.beliTransport)}</span>
                                </div>
                                <div className="flex justify-between text-[10px] border-t border-amber-200/80 pt-1 mt-1">
                                  <span className="font-bold text-amber-950">Total Biaya Beli:</span>
                                  <span className="font-black text-amber-900 font-mono">{formatRupiah(totalBiayaUserBeli)}</span>
                                </div>
                              </div>

                              {/* AKSI PENGOLAHAN */}
                              <div className="bg-blue-50/70 p-2.5 rounded-xl border border-blue-200/80 space-y-1">
                                <span className="font-bold text-[11px] text-blue-900 block border-b border-blue-200/60 pb-1">
                                  🧪 Pemurnian ({u.olahCount} Trx)
                                </span>
                                <div className="flex justify-between text-[10px]">
                                  <span className="text-slate-500">Hasil Murni:</span>
                                  <span className="font-bold text-blue-800 font-mono">{u.olahMurniGram.toFixed(2)}g</span>
                                </div>
                                <div className="flex justify-between text-[10px] border-t border-blue-200/80 pt-1 mt-1">
                                  <span className="font-bold text-blue-950">Biaya Pengolahan:</span>
                                  <span className="font-black text-blue-900 font-mono">{formatRupiah(u.olahBiaya)}</span>
                                </div>
                              </div>

                              {/* AKSI PENJUALAN */}
                              <div className="bg-emerald-50/70 p-2.5 rounded-xl border border-emerald-200/80 space-y-1">
                                <span className="font-bold text-[11px] text-emerald-900 block border-b border-emerald-200/60 pb-1">
                                  💰 Penjualan ({u.jualCount} Trx)
                                </span>
                                <div className="flex justify-between text-[10px]">
                                  <span className="text-slate-500">Murni Terjual:</span>
                                  <span className="font-bold text-emerald-800 font-mono">{u.jualMurniGram.toFixed(2)}g</span>
                                </div>
                                <div className="flex justify-between text-[10px]">
                                  <span className="text-slate-500">Biaya Penjualan:</span>
                                  <span className="font-bold text-red-600 font-mono">{formatRupiah(u.jualBiaya)}</span>
                                </div>
                                <div className="flex justify-between text-[10px] border-t border-emerald-200/80 pt-1 mt-1">
                                  <span className="font-bold text-emerald-950">Total Omset Jual:</span>
                                  <span className="font-black text-emerald-900 font-mono">{formatRupiah(u.jualOmset)}</span>
                                </div>
                              </div>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="p-4 border-b border-slate-200 flex flex-col gap-2">
                    <h3 className="font-bold text-slate-800 text-xs sm:text-sm">Daftar Transaksi Realtime</h3>
                    <input 
                      type="text" 
                      placeholder="🔍 Cari transaksi..." 
                      value={searchTerm} 
                      onChange={(e) => setSearchTerm(e.target.value)} 
                      className="px-3 py-2 border rounded-xl text-xs w-full" 
                    />
                  </div>

                  {/* DISPLAY MOBILE (KARTU) */}
                  <div className="p-3 space-y-2.5 sm:hidden">
                    {filteredTransactions.map((t) => {
                      const hargaBeliUnit = t.hargaBeliSatuan || (t.jumlahKotor ? Math.round(t.totalBeli / t.jumlahKotor) : 0);
                      const hargaJualUnit = t.hargaJualSatuan || (t.jumlahMurni ? Math.round(t.totalJual / t.jumlahMurni) : 0);

                      return (
                        <div key={t.id} className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-1.5 text-xs">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-slate-900">{t.codeId}</span>
                            <span className="px-2 py-0.5 rounded-full text-[9px] font-bold bg-amber-100 text-amber-800">{t.status}</span>
                          </div>
                          
                          <p className="font-semibold text-slate-800">{t.kategoriName}</p>
                          
                          <div className="grid grid-cols-3 gap-1 text-[10px] text-slate-500 bg-white p-2 rounded-lg border border-slate-200">
                            <div>
                              <span className="block font-sans text-slate-400">Tgl Ambil:</span>
                              <span className="font-bold text-slate-700">{t.tanggalAmbil}</span>
                            </div>
                            <div>
                              <span className="block font-sans text-slate-400">Tgl Olah:</span>
                              <span className="font-bold text-blue-600">{t.tanggalOlah || '-'}</span>
                            </div>
                            <div>
                              <span className="block font-sans text-slate-400">Tgl Jual:</span>
                              <span className="font-bold text-emerald-600">{t.tanggalPenjualan || '-'}</span>
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-1 text-[10px] bg-slate-100/70 p-2 rounded-lg font-mono">
                            <div>
                              <span className="block text-[9px] text-slate-400 font-sans">Harga Beli /g:</span>
                              <span className="font-bold text-slate-700">{formatRupiah(hargaBeliUnit)}</span>
                            </div>
                            <div>
                              <span className="block text-[9px] text-slate-400 font-sans">Harga Jual /g:</span>
                              <span className="font-bold text-emerald-700">{hargaJualUnit > 0 ? formatRupiah(hargaJualUnit) : '-'}</span>
                            </div>
                          </div>

                          <div className="flex justify-between items-center pt-1 font-mono">
                            <div>
                              <span className="text-[10px] text-slate-500">Mentah: {t.jumlahKotor}g | Murni: <strong className="text-blue-600">{t.jumlahMurni}g</strong></span>
                            </div>
                            <div className="text-right">
                              <span className="text-[9px] text-slate-400 block font-sans">Laba Bersih:</span>
                              <span className="font-bold text-amber-600">{formatRupiah(t.totalUntung)}</span>
                            </div>
                          </div>

                          <div className="flex justify-end border-t border-slate-200/60 pt-1.5 mt-1">
                            <button onClick={() => handleDeleteTransaction(t.id)} className="text-red-500 text-xs font-bold px-2 py-1">🗑️ Hapus</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* DISPLAY DESKTOP (TABEL TERSTUKTUR) */}
                  <div className="hidden sm:block overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-900 text-white uppercase text-[10px] font-bold">
                        <tr>
                          <th className="px-3 py-3">Kode</th>
                          <th className="px-3 py-3">Tgl Ambil</th>
                          <th className="px-3 py-3">Tgl Olah</th>
                          <th className="px-3 py-3">Tgl Jual</th>
                          <th className="px-3 py-3">Deskripsi Brg</th>
                          <th className="px-3 py-3 text-right">Kotor (g)</th>
                          <th className="px-3 py-3 text-right text-amber-300">Harga Beli/g</th>
                          <th className="px-3 py-3 text-right">Total Beli</th>
                          <th className="px-3 py-3 text-right">Murni (g)</th>
                          <th className="px-3 py-3 text-right text-emerald-300">Harga Jual/g</th>
                          <th className="px-3 py-3 text-right">Total Jual</th>
                          <th className="px-3 py-3 text-right">Laba Bersih</th>
                          <th className="px-3 py-3 text-center">Status</th>
                          <th className="px-3 py-3 text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filteredTransactions.map((t) => {
                          const hargaBeliUnit = t.hargaBeliSatuan || (t.jumlahKotor ? Math.round(t.totalBeli / t.jumlahKotor) : 0);
                          const hargaJualUnit = t.hargaJualSatuan || (t.jumlahMurni ? Math.round(t.totalJual / t.jumlahMurni) : 0);

                          return (
                            <tr key={t.id} className="hover:bg-slate-50">
                              <td className="px-3 py-3 font-bold">{t.codeId}</td>
                              <td className="px-3 py-3">{t.tanggalAmbil}</td>
                              <td className="px-3 py-3 text-blue-600 font-semibold">{t.tanggalOlah || '-'}</td>
                              <td className="px-3 py-3 text-emerald-600 font-semibold">{t.tanggalPenjualan || '-'}</td>
                              <td className="px-3 py-3">{t.kategoriName}</td>
                              <td className="px-3 py-3 text-right font-mono">{t.jumlahKotor}</td>
                              <td className="px-3 py-3 text-right font-mono font-semibold text-slate-600">{formatRupiah(hargaBeliUnit)}</td>
                              <td className="px-3 py-3 text-right font-mono">{formatRupiah(t.totalBeli)}</td>
                              <td className="px-3 py-3 text-right font-mono text-blue-600 font-bold">{t.jumlahMurni}</td>
                              <td className="px-3 py-3 text-right font-mono font-bold text-emerald-600">{hargaJualUnit > 0 ? formatRupiah(hargaJualUnit) : '-'}</td>
                              <td className="px-3 py-3 text-right font-mono text-emerald-600 font-bold">{formatRupiah(t.totalJual)}</td>
                              <td className="px-3 py-3 text-right font-mono text-amber-600 font-bold">{formatRupiah(t.totalUntung)}</td>
                              <td className="px-3 py-3 text-center">
                                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">{t.status}</span>
                              </td>
                              <td className="px-3 py-3 text-center">
                                <button onClick={() => handleDeleteTransaction(t.id)} className="text-red-500 hover:text-red-700 font-bold">🗑️</button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
