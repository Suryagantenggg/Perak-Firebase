<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Refining Perak System - Firebase Cloud Version</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <!-- MODULE SCRIPT UNTUK SINKRONISASI FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // KONFIGURASI FIREBASE PROJECT BARU ANDA
    const firebaseConfig = {
      apiKey: "AIzaSyDs8_zsiK6lbZa_8Jva5t0CoYbgT3rVHSw",
      authDomain: "refining-perak-app.firebaseapp.com",
      projectId: "refining-perak-app",
      storageBucket: "refining-perak-app.firebasestorage.app",
      messagingSenderId: "45607676754",
      appId: "1:45607676754:web:785719de3ae74fa235a88b",
      measurementId: "G-54H37SLNPY"
    };

    // Inisialisasi Firebase App, Firestore, & Auth
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Ekspor Layanan Firebase ke Global Window agar bisa diakses React
    window.fbDb = db;
    window.fbAuth = auth;
    window.fbFS = {
      collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, onSnapshot,
      signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged
    };
  </script>

  <!-- SCRIPT APLIKASI REACT -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_CATEGORIES = [
      { code: 'A', name: 'Pentolan Kontaktor' },
      { code: 'B', name: 'Kontak Point' },
      { code: 'C', name: 'Ex Breaker' },
      { code: 'D', name: 'Mata Ikan (Ex Relay)' },
      { code: 'E', name: 'Mata Ikan (Ex Kontaktor)' },
      { code: 'F', name: 'Tembaga Plating Perak' },
      { code: 'G', name: 'Fuse' },
      { code: 'H', name: 'Patung' }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [authMode, setAuthMode] = useState('login');
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');

      const [signupNama, setSignupNama] = useState('');
      const [signupEmail, setSignupEmail] = useState('');
      const [signupPassword, setSignupPassword] = useState('');

      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');

      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchTerm, setSearchTerm] = useState('');
      const [loading, setLoading] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const [transactions, setTransactions] = useState([]);
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);

      // FILTER PERIODE TANGGAL
      const [dateFilterType, setDateFilterType] = useState('PEMBELIAN');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 4000);
      };

      // MONITORING AUTHENTICATION STATE DARI FIREBASE
      useEffect(() => {
        const checkFB = setInterval(() => {
          if (window.fbAuth) {
            clearInterval(checkFB);
            const { onAuthStateChanged } = window.fbFS;
            onAuthStateChanged(window.fbAuth, (user) => {
              if (user) {
                const displayName = user.displayName || user.email.split('@')[0];
                const userObj = {
                  uid: user.uid,
                  nama: displayName,
                  email: user.email,
                  role: user.email.includes('admin') ? 'Admin' : 'Petugas'
                };
                setCurrentUser(userObj);
              } else {
                setCurrentUser(null);
              }
            });
          }
        }, 100);
      }, []);

      // SINKRONISASI REALTIME TRANSAKSI DARI FIRESTORE DATABASE
      useEffect(() => {
        if (!currentUser) return;
        setLoading(true);

        const checkDB = setInterval(() => {
          if (window.fbDb) {
            clearInterval(checkDB);
            const { collection, query, orderBy, onSnapshot } = window.fbFS;
            const q = query(collection(window.fbDb, "transactions"), orderBy("createdAt", "desc"));

            const unsubscribe = onSnapshot(q, (snapshot) => {
              const list = [];
              snapshot.forEach((doc) => {
                list.push({ id: doc.id, ...doc.data() });
              });
              setTransactions(list);
              setLoading(false);
            }, (error) => {
              console.error("Firestore error:", error);
              setLoading(false);
            });

            return () => unsubscribe();
          }
        }, 100);
      }, [currentUser]);

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setAuthError('');

        try {
          const { signInWithEmailAndPassword } = window.fbFS;
          await signInWithEmailAndPassword(window.fbAuth, loginEmail.trim(), loginPassword.trim());
          setLoading(false);
          showToast('Berhasil Masuk!');
        } catch (err) {
          setLoading(false);
          setAuthError('Email atau Password salah / Akun belum terdaftar.');
        }
      };

      const handleSignUpSubmit = async (e) => {
        e.preventDefault();
        if (!signupNama.trim() || !signupEmail.trim() || !signupPassword.trim()) {
          return setAuthError('Semua bidang harus diisi!');
        }

        setLoading(true);
        setAuthError('');

        try {
          const { createUserWithEmailAndPassword } = window.fbFS;
          await createUserWithEmailAndPassword(window.fbAuth, signupEmail.trim(), signupPassword.trim());
          
          setLoading(false);
          setAuthSuccess('🎉 Akun berhasil dibuat! Silakan masuk.');
          setLoginEmail(signupEmail.trim());
          setSignupNama('');
          setSignupEmail('');
          setSignupPassword('');
          setAuthMode('login');
        } catch (err) {
          setLoading(false);
          setAuthError('Gagal membuat akun: ' + err.message);
        }
      };

      const handleLogout = async () => {
        if (window.confirm('Yakin ingin keluar dari sistem?')) {
          const { signOut } = window.fbFS;
          await signOut(window.fbAuth);
          setCurrentUser(null);
        }
      };

      const getTodayFormatted = () => {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      };

      const [formAmbil, setFormAmbil] = useState({
        tanggal: getTodayFormatted(),
        pengambilSelect: '',
        tempatAmbil: '',
        lokasiAmbil: '',
        kategoriCode: 'A',
        jumlahKotor: '',
        hargaBeliSatuan: '',
        biayaTransport: ''
      });

      const [formOlah, setFormOlah] = useState({
        selectedTrxIds: [],
        tanggalOlah: getTodayFormatted(),
        pengolahSelect: '',
        jumlahMurni: '',
        biayaOlah: ''
      });

      const [formJual, setFormJual] = useState({
        selectedTrxIds: [],
        tanggalJual: getTodayFormatted(),
        hargaJualSatuan: '',
        biayaPenjualan: ''
      });

      const formatRupiah = (val) => {
        if (val === undefined || val === null || isNaN(val)) return 'Rp 0';
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
      };

      // INPUT PEMBELIAN BARU KE FIRESTORE
      const handleSavePengambilan = async (e) => {
        e.preventDefault();
        setLoading(true);

        const kotor = parseFloat(formAmbil.jumlahKotor) || 0;
        const hargaBeli = parseFloat(formAmbil.hargaBeliSatuan) || 0;
        const transport = parseFloat(formAmbil.biayaTransport) || 0;
        const selectedCat = categories.find(c => c.code === formAmbil.kategoriCode) || categories[0];

        const payload = {
          codeId: 'TRX-' + Math.floor(1000 + Math.random() * 9000),
          tanggalAmbil: formAmbil.tanggal,
          kategoriName: `[${selectedCat.code}] ${selectedCat.name}`,
          pengambil: formAmbil.pengambilSelect || currentUser.nama,
          tempatAmbil: formAmbil.tempatAmbil,
          lokasiAmbil: formAmbil.lokasiAmbil,
          jumlahKotor: kotor,
          totalBeli: kotor * hargaBeli,
          biayaTransport: transport,
          pengolah: '-',
          jumlahMurni: 0,
          biayaOlah: 0,
          efisiensi: 0,
          tanggalOlah: '',
          tanggalPenjualan: '',
          tokoPembeli: '-',
          jumlahJual: 0,
          hargaJualSatuan: 0,
          totalJual: 0,
          biayaPenjualan: 0,
          totalUntung: 0,
          status: 'MENUNGGU_OLAH',
          createdAt: Date.now()
        };

        try {
          const { collection, addDoc } = window.fbFS;
          await addDoc(collection(window.fbDb, "transactions"), payload);
          setLoading(false);
          showToast('🎉 Pembelian baru tersimpan di Firebase!');
          setFormAmbil({ ...formAmbil, tempatAmbil: '', lokasiAmbil: '', jumlahKotor: '', hargaBeliSatuan: '', biayaTransport: '' });
          setActiveTab('dashboard');
        } catch (err) {
          setLoading(false);
          alert('Gagal menyimpan data: ' + err.message);
        }
      };

      const handleToggleSelectOlah = (id) => {
        const current = formOlah.selectedTrxIds;
        if (current.includes(id)) setFormOlah({ ...formOlah, selectedTrxIds: current.filter(x => x !== id) });
        else setFormOlah({ ...formOlah, selectedTrxIds: [...current, id] });
      };

      const handleToggleSelectJual = (id) => {
        const current = formJual.selectedTrxIds;
        if (current.includes(id)) setFormJual({ ...formJual, selectedTrxIds: current.filter(x => x !== id) });
        else setFormJual({ ...formJual, selectedTrxIds: [...current, id] });
      };

      const selectedTrxOlahList = transactions.filter(t => formOlah.selectedTrxIds.includes(t.id));
      const totalKotorSelected = selectedTrxOlahList.reduce((sum, t) => sum + t.jumlahKotor, 0);
      const totalModalSelected = selectedTrxOlahList.reduce((sum, t) => sum + t.totalBeli, 0);

      const murniVal = parseFloat(formOlah.jumlahMurni) || 0;
      const totalBiayaOlahVal = parseFloat(formOlah.biayaOlah) || 0;

      // SIMPAN PENGOLAHAN KE FIRESTORE
      const handleSavePengolahan = async (e) => {
        e.preventDefault();
        if (formOlah.selectedTrxIds.length === 0) return alert('Pilih minimal 1 transaksi!');
        if (murniVal <= 0) return alert('Hasil Perak Murni harus > 0!');

        setLoading(true);
        const { doc, updateDoc } = window.fbFS;

        try {
          for (let t of selectedTrxOlahList) {
            const porsiGram = t.jumlahKotor / totalKotorSelected;
            const murniItem = parseFloat((murniVal * porsiGram).toFixed(2));
            const biayaItem = parseFloat((totalBiayaOlahVal * porsiGram).toFixed(0));
            const efisiensiItem = parseFloat(((murniItem / t.jumlahKotor) * 100).toFixed(2));

            const docRef = doc(window.fbDb, "transactions", t.id);
            await updateDoc(docRef, {
              tanggalOlah: formOlah.tanggalOlah,
              pengolah: (formOlah.pengolahSelect || currentUser.nama).trim(),
              jumlahMurni: murniItem,
              biayaOlah: biayaItem,
              efisiensi: efisiensiItem,
              status: 'SELESAI_OLAH'
            });
          }

          setLoading(false);
          showToast('🧪 Data Pemurnian berhasil di-update!');
          setFormOlah({ selectedTrxIds: [], tanggalOlah: getTodayFormatted(), pengolahSelect: '', jumlahMurni: '', biayaOlah: '' });
          setActiveTab('dashboard');
        } catch (err) {
          setLoading(false);
          alert('Gagal update pemurnian: ' + err.message);
        }
      };

      const selectedTrxJualList = transactions.filter(t => formJual.selectedTrxIds.includes(t.id));
      const totalMurniJualSelected = selectedTrxJualList.reduce((sum, t) => sum + t.jumlahMurni, 0);
      const hargaJualVal = parseFloat(formJual.hargaJualSatuan) || 0;
      const totalBiayaPenjualanVal = parseFloat(formJual.biayaPenjualan) || 0;

      // SIMPAN PENJUALAN KE FIRESTORE
      const handleSavePenjualan = async (e) => {
        e.preventDefault();
        if (formJual.selectedTrxIds.length === 0) return alert('Pilih minimal 1 barang!');
        if (hargaJualVal <= 0) return alert('Harga jual per gram harus > 0!');

        setLoading(true);
        const { doc, updateDoc } = window.fbFS;

        try {
          for (let t of selectedTrxJualList) {
            const porsiMurni = t.jumlahMurni / totalMurniJualSelected;
            const totalJualItem = parseFloat((t.jumlahMurni * hargaJualVal).toFixed(0));
            const biayaPenjualanItem = parseFloat((totalBiayaPenjualanVal * porsiMurni).toFixed(0));
            const totalUntungItem = totalJualItem - t.totalBeli - t.biayaTransport - t.biayaOlah - biayaPenjualanItem;

            const docRef = doc(window.fbDb, "transactions", t.id);
            await updateDoc(docRef, {
              tanggalPenjualan: formJual.tanggalJual,
              jumlahJual: t.jumlahMurni,
              hargaJualSatuan: hargaJualVal,
              totalJual: totalJualItem,
              tokoPembeli: currentUser.nama,
              biayaPenjualan: biayaPenjualanItem,
              totalUntung: totalUntungItem,
              status: 'TERJUAL'
            });
          }

          setLoading(false);
          showToast('💰 Data Penjualan berhasil dicatat!');
          setFormJual({ selectedTrxIds: [], tanggalJual: getTodayFormatted(), hargaJualSatuan: '', biayaPenjualan: '' });
          setActiveTab('dashboard');
        } catch (err) {
          setLoading(false);
          alert('Gagal update penjualan: ' + err.message);
        }
      };

      const handleDeleteTransaction = async (id) => {
        if (window.confirm(`Hapus transaksi ini dari Firebase?`)) {
          setLoading(true);
          try {
            const { doc, deleteDoc } = window.fbFS;
            await deleteDoc(doc(window.fbDb, "transactions", id));
            setLoading(false);
            showToast('🗑️ Transaksi berhasil dihapus!');
          } catch (err) {
            setLoading(false);
            alert('Gagal menghapus data!');
          }
        }
      };

      const dateFilteredTransactions = transactions.filter(t => {
        let tDate = '';
        if (dateFilterType === 'PEMBELIAN') tDate = t.tanggalAmbil;
        else if (dateFilterType === 'PENGOLAHAN') tDate = t.tanggalOlah;
        else if (dateFilterType === 'PENJUALAN') tDate = t.tanggalPenjualan;

        if (!tDate) return (!startDate && !endDate);
        if (startDate && tDate < startDate) return false;
        if (endDate && tDate > endDate) return false;
        return true;
      });

      const filteredTransactions = dateFilteredTransactions.filter(t => {
        const term = searchTerm.toLowerCase();
        return (
          (t.codeId || '').toLowerCase().includes(term) ||
          (t.kategoriName || '').toLowerCase().includes(term) ||
          (t.pengambil || '').toLowerCase().includes(term) ||
          (t.tempatAmbil || '').toLowerCase().includes(term) ||
          (t.pengolah || '').toLowerCase().includes(term)
        );
      });

      const totalBarangKotor = filteredTransactions.reduce((acc, t) => acc + (t.jumlahKotor || 0), 0);
      const totalPerakMurni = filteredTransactions.reduce((acc, t) => acc + (t.jumlahMurni || 0), 0);
      const totalBeliModal = filteredTransactions.reduce((acc, t) => acc + (t.totalBeli || 0), 0);
      const totalOmsetPenjualan = filteredTransactions.filter(t => t.status === 'TERJUAL').reduce((acc, t) => acc + (t.totalJual || 0), 0);
      const totalLabaBersih = filteredTransactions.filter(t => t.status === 'TERJUAL').reduce((acc, t) => acc + (t.totalUntung || 0), 0);

      const pendingOlahList = transactions.filter(t => t.status === 'MENUNGGU_OLAH');
      const pendingJualList = transactions.filter(t => t.status === 'SELESAI_OLAH');

      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center px-4 py-8">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 border border-slate-800">
              <div className="text-center mb-6">
                <div className="inline-block bg-amber-500 text-slate-900 p-3 rounded-2xl font-black text-3xl mb-2">Ag</div>
                <h2 className="text-2xl font-bold text-slate-800">Refining Perak System</h2>
                <p className="text-xs text-slate-500 mt-1">🔥 Powered by Firebase Cloud</p>
              </div>

              <div className="flex bg-slate-100 p-1 rounded-xl mb-6">
                <button
                  onClick={() => { setAuthMode('login'); setAuthError(''); setAuthSuccess(''); }}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${
                    authMode === 'login' ? 'bg-amber-500 text-slate-900 shadow' : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  Masuk (Sign In)
                </button>
                <button
                  onClick={() => { setAuthMode('signup'); setAuthError(''); setAuthSuccess(''); }}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${
                    authMode === 'signup' ? 'bg-amber-500 text-slate-900 shadow' : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  Daftar (Sign Up)
                </button>
              </div>

              {authError && (
                <div className="bg-red-50 border border-red-200 text-red-600 px-4 py-2.5 rounded-lg text-xs font-semibold mb-4">
                  ⚠️ {authError}
                </div>
              )}

              {authSuccess && (
                <div className="bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-2.5 rounded-lg text-xs font-semibold mb-4">
                  {authSuccess}
                </div>
              )}

              {authMode === 'login' && (
                <form onSubmit={handleLoginSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Email</label>
                    <input
                      type="email"
                      required
                      placeholder="e.g. user@perak.com"
                      value={loginEmail}
                      onChange={(e) => setLoginEmail(e.target.value)}
                      className="w-full px-4 py-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                    <input
                      type="password"
                      required
                      placeholder="Masukkan password"
                      value={loginPassword}
                      onChange={(e) => setLoginPassword(e.target.value)}
                      className="w-full px-4 py-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500"
                    />
                  </div>
                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-xl shadow-lg transition"
                  >
                    {loading ? 'Memproses...' : 'Masuk Ke Sistem ➔'}
                  </button>
                </form>
              )}

              {authMode === 'signup' && (
                <form onSubmit={handleSignUpSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Lengkap</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Reva Surya"
                      value={signupNama}
                      onChange={(e) => setSignupNama(e.target.value)}
                      className="w-full px-4 py-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Email Baru</label>
                    <input
                      type="email"
                      required
                      placeholder="e.g. reva@perak.com"
                      value={signupEmail}
                      onChange={(e) => setSignupEmail(e.target.value)}
                      className="w-full px-4 py-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Password Baru</label>
                    <input
                      type="password"
                      required
                      placeholder="Minimal 6 karakter"
                      value={signupPassword}
                      onChange={(e) => setSignupPassword(e.target.value)}
                      className="w-full px-4 py-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500"
                    />
                  </div>
                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition"
                  >
                    {loading ? 'Mendaftarkan...' : 'Daftar Akun Baru ➔'}
                  </button>
                </form>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 font-sans relative">
          {toastMsg && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-emerald-400 border border-emerald-500 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-bounce">
              <span className="text-lg">✨</span>
              <p className="text-xs font-bold">{toastMsg}</p>
            </div>
          )}

          {loading && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white">
              <div className="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-3"></div>
              <p className="text-sm font-bold tracking-wider">Menghubungkan ke Firebase Cloud...</p>
            </div>
          )}

          <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
              <div className="flex items-center space-x-3">
                <div className="bg-amber-500 text-slate-900 p-2 rounded-lg font-black text-xl">Ag</div>
                <div>
                  <h1 className="text-lg font-bold tracking-wide">Refining Perak System</h1>
                  <p className="text-xs text-amber-400 font-semibold">🔥 Connected to Firebase Firestore</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="text-right">
                  <p className="text-xs font-bold text-slate-200">{currentUser.nama}</p>
                  <span className="text-[10px] bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded font-semibold">{currentUser.role}</span>
                </div>
                <button 
                  onClick={handleLogout}
                  className="text-xs bg-red-600/20 hover:bg-red-600/40 text-red-300 border border-red-500/30 px-3 py-1.5 rounded font-bold transition"
                >
                  🚪 Logout
                </button>
              </div>
            </div>

            <nav className="bg-slate-800 border-t border-slate-700">
              <div className="max-w-7xl mx-auto px-4 flex overflow-x-auto">
                <button
                  onClick={() => setActiveTab('pengambilan')}
                  className={`px-4 py-3 text-sm font-medium whitespace-nowrap border-b-2 transition ${
                    activeTab === 'pengambilan' ? 'border-amber-500 text-amber-400 bg-slate-900/50' : 'border-transparent text-slate-300 hover:text-white'
                  }`}
                >
                  📥 1. Input Pembelian
                </button>
                <button
                  onClick={() => setActiveTab('pengolahan')}
                  className={`px-4 py-3 text-sm font-medium whitespace-nowrap border-b-2 transition ${
                    activeTab === 'pengolahan' ? 'border-amber-500 text-amber-400 bg-slate-900/50' : 'border-transparent text-slate-300 hover:text-white'
                  }`}
                >
                  🧪 2. Input Pengolahan ({pendingOlahList.length})
                </button>
                <button
                  onClick={() => setActiveTab('penjualan')}
                  className={`px-4 py-3 text-sm font-medium whitespace-nowrap border-b-2 transition ${
                    activeTab === 'penjualan' ? 'border-amber-500 text-amber-400 bg-slate-900/50' : 'border-transparent text-slate-300 hover:text-white'
                  }`}
                >
                  💰 3. Input Penjualan ({pendingJualList.length})
                </button>
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-4 py-3 text-sm font-medium whitespace-nowrap border-b-2 transition ${
                    activeTab === 'dashboard' ? 'border-amber-500 text-amber-400 bg-slate-900/50' : 'border-transparent text-slate-300 hover:text-white'
                  }`}
                >
                  📊 Laporan & Recap Biaya
                </button>
              </div>
            </nav>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-8">
            {/* TAB 1: PEMBELIAN */}
            {activeTab === 'pengambilan' && (
              <div className="max-w-2xl mx-auto bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
                <div className="bg-slate-900 text-white p-6">
                  <h2 className="text-lg font-bold">📥 Input Pembelian Barang Mentah</h2>
                </div>
                <form onSubmit={handleSavePengambilan} className="p-6 space-y-4">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Tanggal Pengambilan</label>
                      <input type="date" required value={formAmbil.tanggal} onChange={(e) => setFormAmbil({ ...formAmbil, tanggal: e.target.value })} className="w-full px-3 py-2 border rounded-lg text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Nama Pengambil Barang (PIC)</label>
                      <input type="text" required placeholder="e.g. Andi" value={formAmbil.pengambilSelect} onChange={(e) => setFormAmbil({ ...formAmbil, pengambilSelect: e.target.value })} className="w-full px-3 py-2 border rounded-lg text-sm" />
                    </div>
                  </div>

                  <div className="p-4 bg-slate-50 rounded-lg border border-slate-200 space-y-3">
                    <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider">📍 Sumber & Lokasi Pengambilan</h4>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">Lokasi Pengambilan</label>
                        <input type="text" required placeholder="e.g. PT Surya Jaya" value={formAmbil.tempatAmbil} onChange={(e) => setFormAmbil({ ...formAmbil, tempatAmbil: e.target.value })} className="w-full px-3 py-2 border rounded-lg text-sm bg-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">Daerah Pengambilan</label>
                        <input type="text" required placeholder="e.g. Cikarang, Bekasi" value={formAmbil.lokasiAmbil} onChange={(e) => setFormAmbil({ ...formAmbil, lokasiAmbil: e.target.value })} className="w-full px-3 py-2 border rounded-lg text-sm bg-white" />
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Kategori Jenis Barang</label>
                    <select value={formAmbil.kategoriCode} onChange={(e) => setFormAmbil({ ...formAmbil, kategoriCode: e.target.value })} className="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                      {categories.map((cat) => (
                        <option key={cat.code} value={cat.code}>[{cat.code}] {cat.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Total Jumlah (Gram)</label>
                      <input type="number" step="0.01" required value={formAmbil.jumlahKotor} onChange={(e) => setFormAmbil({ ...formAmbil, jumlahKotor: e.target.value })} className="w-full px-3 py-2 border rounded-lg text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Harga Beli / Gram (Rp)</label>
                      <input type="number" required value={formAmbil.hargaBeliSatuan} onChange={(e) => setFormAmbil({ ...formAmbil, hargaBeliSatuan: e.target.value })} className="w-full px-3 py-2 border rounded-lg text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Biaya Transport (Rp)</label>
                      <input type="number" placeholder="e.g. 50000" value={formAmbil.biayaTransport} onChange={(e) => setFormAmbil({ ...formAmbil, biayaTransport: e.target.value })} className="w-full px-3 py-2 border rounded-lg text-sm" />
                    </div>
                  </div>

                  <button type="submit" disabled={loading} className="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-lg shadow">
                    Simpan ke Firebase ➔
                  </button>
                </form>
              </div>
            )}

            {/* TAB 2: PENGOLAHAN */}
            {activeTab === 'pengolahan' && (
              <div className="max-w-3xl mx-auto bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
                <div className="bg-slate-900 text-white p-6">
                  <h2 className="text-lg font-bold">🧪 Input Pengolahan & Pemurnian</h2>
                </div>
                <form onSubmit={handleSavePengolahan} className="p-6 space-y-6">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-2">
                      Pilih Transaksi ({formOlah.selectedTrxIds.length} Dipilih)
                    </label>
                    {pendingOlahList.length === 0 ? (
                      <div className="p-4 bg-slate-50 border rounded-lg text-xs text-slate-500 text-center">
                        Tidak ada antrean barang mentah yang belum diolah.
                      </div>
                    ) : (
                      <div className="max-h-56 overflow-y-auto border border-slate-200 rounded-lg divide-y divide-slate-100">
                        {pendingOlahList.map((t) => {
                          const isChecked = formOlah.selectedTrxIds.includes(t.id);
                          return (
                            <label key={t.id} className={`flex items-center justify-between p-3 cursor-pointer transition ${isChecked ? 'bg-amber-50' : 'hover:bg-slate-50'}`}>
                              <div className="flex items-center gap-3">
                                <input type="checkbox" checked={isChecked} onChange={() => handleToggleSelectOlah(t.id)} className="w-4 h-4 text-amber-500 rounded" />
                                <div>
                                  <p className="font-bold text-xs text-slate-800">{t.codeId} - {t.kategoriName}</p>
                                  <p className="text-[11px] text-slate-500">📍 {t.tempatAmbil} | PIC: {t.pengambil}</p>
                                </div>
                              </div>
                              <div className="text-right">
                                <p className="font-mono font-bold text-xs text-slate-700">{t.jumlahKotor} Gram</p>
                              </div>
                            </label>
                          );
                        })}
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Tanggal Pengolahan</label>
                      <input type="date" required value={formOlah.tanggalOlah} onChange={(e) => setFormOlah({ ...formOlah, tanggalOlah: e.target.value })} className="w-full px-3 py-2 border rounded-lg text-sm bg-white" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">PIC Pengolah</label>
                      <input type="text" required placeholder="e.g. Zaenal" value={formOlah.pengolahSelect} onChange={(e) => setFormOlah({ ...formOlah, pengolahSelect: e.target.value })} className="w-full px-3 py-2 border rounded-lg text-sm" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Hasil Pengolahan (Gram)</label>
                      <input type="number" step="0.01" required value={formOlah.jumlahMurni} onChange={(e) => setFormOlah({ ...formOlah, jumlahMurni: e.target.value })} className="w-full px-3 py-2 border rounded-lg text-sm font-bold text-blue-700" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Biaya Pengolahan (Rp)</label>
                      <input type="number" placeholder="e.g. 100000" value={formOlah.biayaOlah} onChange={(e) => setFormOlah({ ...formOlah, biayaOlah: e.target.value })} className="w-full px-3 py-2 border rounded-lg text-sm" />
                    </div>
                  </div>

                  <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow">
                    Simpan Pemurnian ke Firebase ➔
                  </button>
                </form>
              </div>
            )}

            {/* TAB 3: PENJUALAN */}
            {activeTab === 'penjualan' && (
              <div className="max-w-3xl mx-auto bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
                <div className="bg-slate-900 text-white p-6">
                  <h2 className="text-lg font-bold">💰 Input Penjualan Perak Murni</h2>
                </div>
                <form onSubmit={handleSavePenjualan} className="p-6 space-y-6">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-2">
                      Pilih Barang Siap Jual ({formJual.selectedTrxIds.length} Dipilih)
                    </label>
                    {pendingJualList.length === 0 ? (
                      <div className="p-4 bg-slate-50 border rounded-lg text-xs text-slate-500 text-center">
                        Tidak ada barang hasil olahan yang belum dijual.
                      </div>
                    ) : (
                      <div className="max-h-56 overflow-y-auto border border-slate-200 rounded-lg divide-y divide-slate-100">
                        {pendingJualList.map((t) => {
                          const isChecked = formJual.selectedTrxIds.includes(t.id);
                          return (
                            <label key={t.id} className={`flex items-center justify-between p-3 cursor-pointer transition ${isChecked ? 'bg-emerald-50' : 'hover:bg-slate-50'}`}>
                              <div className="flex items-center gap-3">
                                <input type="checkbox" checked={isChecked} onChange={() => handleToggleSelectJual(t.id)} className="w-4 h-4 text-emerald-600 rounded" />
                                <div>
                                  <p className="font-bold text-xs text-slate-800">{t.codeId} - {t.kategoriName}</p>
                                  <p className="text-[11px] text-slate-500">Pengolah: {t.pengolah}</p>
                                </div>
                              </div>
                              <div className="text-right">
                                <p className="font-mono font-bold text-xs text-blue-600">{t.jumlahMurni} Gram</p>
                              </div>
                            </label>
                          );
                        })}
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Tanggal Penjualan</label>
                      <input type="date" required value={formJual.tanggalJual} onChange={(e) => setFormJual({ ...formJual, tanggalJual: e.target.value })} className="w-full px-3 py-2 border rounded-lg text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Harga Jual / Gram (Rp)</label>
                      <input type="number" required value={formJual.hargaJualSatuan} onChange={(e) => setFormJual({ ...formJual, hargaJualSatuan: e.target.value })} className="w-full px-3 py-2 border rounded-lg text-sm font-bold text-emerald-700" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Biaya Aktifitas Penjualan (Rp)</label>
                    <input type="number" placeholder="e.g. 50000" value={formJual.biayaPenjualan} onChange={(e) => setFormJual({ ...formJual, biayaPenjualan: e.target.value })} className="w-full px-3 py-2 border rounded-lg text-sm" />
                  </div>

                  <button type="submit" disabled={loading} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow">
                    Selesaikan Penjualan ke Firebase ➔
                  </button>
                </form>
              </div>
            )}

            {/* TAB 4: LAPORAN & METRIK REALTIME */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <span className="text-xs font-semibold text-slate-400 uppercase">Total Barang Mentah</span>
                    <p className="text-2xl font-black text-slate-800 mt-1">{totalBarangKotor.toFixed(2)} <span className="text-sm font-normal">Gram</span></p>
                    <span className="text-xs text-slate-500 mt-1 block">Modal Beli: {formatRupiah(totalBeliModal)}</span>
                  </div>
                  <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <span className="text-xs font-semibold text-slate-400 uppercase">Hasil Perak Murni</span>
                    <p className="text-2xl font-black text-blue-600 mt-1">{totalPerakMurni.toFixed(2)} <span className="text-sm font-normal">Gram</span></p>
                  </div>
                  <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <span className="text-xs font-semibold text-slate-400 uppercase">Total Omset Penjualan</span>
                    <p className="text-2xl font-black text-emerald-600 mt-1">{formatRupiah(totalOmsetPenjualan)}</p>
                  </div>
                  <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <span className="text-xs font-semibold text-slate-400 uppercase">Total Laba Bersih</span>
                    <p className="text-2xl font-black text-amber-600 mt-1">{formatRupiah(totalLabaBersih)}</p>
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="p-5 border-b border-slate-200 flex justify-between items-center">
                    <h3 className="font-bold text-slate-800">Daftar Transaksi (Firebase Realtime Database)</h3>
                    <input type="text" placeholder="🔍 Cari..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="px-3 py-1.5 border rounded-lg text-xs" />
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-900 text-white uppercase text-[10px] font-bold">
                        <tr>
                          <th className="px-3 py-3">Kode</th>
                          <th className="px-3 py-3">Tgl Ambil</th>
                          <th className="px-3 py-3">Deskripsi Brg</th>
                          <th className="px-3 py-3">PIC</th>
                          <th className="px-3 py-3 text-right">Kotor (g)</th>
                          <th className="px-3 py-3 text-right">Total Beli</th>
                          <th className="px-3 py-3">PIC Olah</th>
                          <th className="px-3 py-3 text-right">Murni (g)</th>
                          <th className="px-3 py-3 text-right">Total Jual</th>
                          <th className="px-3 py-3 text-right">Laba Bersih</th>
                          <th className="px-3 py-3 text-center">Status</th>
                          <th className="px-3 py-3 text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {filteredTransactions.map((t) => (
                          <tr key={t.id} className="hover:bg-slate-50">
                            <td className="px-3 py-3 font-bold">{t.codeId}</td>
                            <td className="px-3 py-3">{t.tanggalAmbil}</td>
                            <td className="px-3 py-3">{t.kategoriName}</td>
                            <td className="px-3 py-3">{t.pengambil}</td>
                            <td className="px-3 py-3 text-right font-mono">{t.jumlahKotor}</td>
                            <td className="px-3 py-3 text-right font-mono">{formatRupiah(t.totalBeli)}</td>
                            <td className="px-3 py-3">{t.pengolah}</td>
                            <td className="px-3 py-3 text-right font-mono text-blue-600 font-bold">{t.jumlahMurni}</td>
                            <td className="px-3 py-3 text-right font-mono text-emerald-600 font-bold">{formatRupiah(t.totalJual)}</td>
                            <td className="px-3 py-3 text-right font-mono text-amber-600 font-bold">{formatRupiah(t.totalUntung)}</td>
                            <td className="px-3 py-3 text-center">
                              <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">{t.status}</span>
                            </td>
                            <td className="px-3 py-3 text-center">
                              <button onClick={() => handleDeleteTransaction(t.id)} className="text-red-500 hover:text-red-700 font-bold">🗑️</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
