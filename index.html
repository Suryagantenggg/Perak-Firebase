<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Refining Perak System - Cahaya Gemilang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- JSPDF & AUTOTABLE FOR PDF GENERATION -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-amber-500 selection:text-slate-900">
  <div id="root"></div>

  <!-- MODULE SCRIPT FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, getDocs, doc, setDoc, updateDoc, deleteDoc, query, orderBy, onSnapshot, getDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDs8_zsiK6lbZa_8Jva5t0CoYbgT3rVHSw",
      authDomain: "refining-perak-app.firebaseapp.com",
      projectId: "refining-perak-app",
      storageBucket: "refining-perak-app.firebasestorage.app",
      messagingSenderId: "45607676754",
      appId: "1:45607676754:web:785719de3ae74fa235a88b",
      measurementId: "G-54H37SLNPY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.fbDb = db;
    window.fbAuth = auth;
    window.fbFS = {
      collection, addDoc, getDocs, doc, setDoc, updateDoc, deleteDoc, query, orderBy, onSnapshot, getDoc,
      signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged
    };
  </script>

  <!-- SCRIPT APLIKASI REACT -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_CATEGORIES = [
      { code: 'A', name: 'Pentolan Kontaktor' },
      { code: 'B', name: 'Kontak Point' },
      { code: 'C', name: 'Ex Breaker' },
      { code: 'D', name: 'Mata Ikan (Ex Relay)' },
      { code: 'E', name: 'Mata Ikan (Ex Kontaktor)' },
      { code: 'F', name: 'Tembaga Plating Perak' },
      { code: 'G', name: 'Fuse' },
      { code: 'H', name: 'Patung' },
      { code: 'I', name: 'ACB' }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [authMode, setAuthMode] = useState('login');
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');

      const [signupNama, setSignupNama] = useState('');
      const [signupEmail, setSignupEmail] = useState('');
      const [signupPassword, setSignupPassword] = useState('');

      const [forgotEmail, setForgotEmail] = useState('');

      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');

      const [activeTab, setActiveTab] = useState('flow_info');
      const [searchTerm, setSearchTerm] = useState('');
      const [loading, setLoading] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const [transactions, setTransactions] = useState([]);
      const [categories, setCategories] = useState([]);
      const [pemodalList, setPemodalList] = useState([]);
      const [withdrawalList, setWithdrawalList] = useState([]);
      const [profitWithdrawalList, setProfitWithdrawalList] = useState([]);
      const [additionList, setAdditionList] = useState([]);
      const [toolsList, setToolsList] = useState([]);
      const [userList, setUserList] = useState([]);

      // STATE CUSTOMER SERVICE
      const [csInfo, setCsInfo] = useState({
        namaCs: 'Customer Service CG',
        noWa: '6281234567890',
        pesanDefault: 'Halo Admin, saya tertarik menjadi investor di Refining Perak Cahaya Gemilang.'
      });

      const [formCs, setFormCs] = useState({
        namaCs: '',
        noWa: '',
        pesanDefault: ''
      });

      const [newCatCode, setNewCatCode] = useState('');
      const [newCatName, setNewCatName] = useState('');

      // STATE NISBAH PENGELOLA
      const [nisbahPengelolaPct, setNisbahPengelolaPct] = useState(0);

      const getTodayFormatted = () => {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      };

      const getCurrentMonthFormatted = () => {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        return `${y}-${m}`;
      };

      // STATE FORM INPUT TOOLS (BAHAN/ALAT PENDUKUNG)
      const [formTools, setFormTools] = useState({
        tanggal: getTodayFormatted(),
        namaTools: '',
        deskripsi: '',
        jenis: 'Bahan Kimia',
        jumlah: '',
        harga: '',
        pencatatSelect: ''
      });

      // STATE FILTER TANGGAL KHUSUS MENU PEMODAL
      const [pemodalFilterType, setPemodalFilterType] = useState('ALL');
      const [pemodalFilterMonth, setPemodalFilterMonth] = useState(getCurrentMonthFormatted());
      const [pemodalStartDate, setPemodalStartDate] = useState('');
      const [pemodalEndDate, setPemodalEndDate] = useState('');

      // STATE FILTER MENU LAPORAN
      const [reportFilterBy, setReportFilterBy] = useState('PEMBELIAN');
      const [reportFilterType, setReportFilterType] = useState('ALL');
      const [reportFilterMonth, setReportFilterMonth] = useState(getCurrentMonthFormatted());
      const [reportStartDate, setReportStartDate] = useState('');
      const [reportEndDate, setReportEndDate] = useState('');

      // STATE FILTER UNTUK TAB NERACA KAS & SALDO
      const [neracaFilterType, setNeracaFilterType] = useState('ALL');
      const [neracaFilterMonth, setNeracaFilterMonth] = useState(getCurrentMonthFormatted());
      const [neracaStartDate, setNeracaStartDate] = useState('');
      const [neracaEndDate, setNeracaEndDate] = useState('');

      // STATE KHUSUS RECAP PDF
      const [recapFilterType, setRecapFilterType] = useState('ALL');
      const [recapFilterMonth, setRecapFilterMonth] = useState(getCurrentMonthFormatted());
      const [recapStartDate, setRecapStartDate] = useState('');
      const [recapEndDate, setRecapEndDate] = useState('');
      const [recapPdfTitle, setRecapPdfTitle] = useState('Laporan Rekapitulasi Refining Perak');
      const [recapPdfNotes, setRecapPdfNotes] = useState('');

      const [formPemodal, setFormPemodal] = useState({
        namaPemodal: '',
        jumlahModal: '',
        tanggalBergabung: getTodayFormatted(),
        kontak: '',
        catatan: ''
      });

      // STATE MODAL PENARIKAN MODAL UTAMA
      const [selectedPemodalWithdraw, setSelectedPemodalWithdraw] = useState(null);
      const [formWithdraw, setFormWithdraw] = useState({
        tanggal: getTodayFormatted(),
        jumlahTarik: '',
        catatan: ''
      });

      // STATE MODAL PENARIKAN LABA BERSIH INVESTOR (DIVIDEN)
      const [selectedPemodalProfitWD, setSelectedPemodalProfitWD] = useState(null);
      const [formProfitWithdraw, setFormProfitWithdraw] = useState({
        tanggal: getTodayFormatted(),
        jumlahTarik: '',
        catatan: ''
      });

      // STATE MODAL TAMBAH MODAL
      const [selectedPemodalAdd, setSelectedPemodalAdd] = useState(null);
      const [formAddModal, setFormAddModal] = useState({
        tanggal: getTodayFormatted(),
        jumlahTambah: '',
        catatan: ''
      });

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 4000);
      };

      const formatRupiah = (val) => {
        if (val === undefined || val === null || isNaN(val)) return 'Rp 0';
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
      };

      useEffect(() => {
        const checkFB = setInterval(() => {
          if (window.fbAuth) {
            clearInterval(checkFB);
            const { onAuthStateChanged, doc, getDoc } = window.fbFS;
            onAuthStateChanged(window.fbAuth, async (user) => {
              if (user) {
                let userRole = 'Client';
                let displayName = user.displayName || user.email.split('@')[0];

                try {
                  const userSnap = await getDoc(doc(window.fbDb, "users", user.uid));
                  if (userSnap.exists()) {
                    const userData = userSnap.data();
                    if (userData.nama) displayName = userData.nama;
                    if (userData.role) userRole = userData.role;
                  }
                } catch (e) {
                  console.error("Gagal mengambil profile user:", e);
                }

                setCurrentUser({ uid: user.uid, nama: displayName, email: user.email, role: userRole });
              } else {
                setCurrentUser(null);
              }
            });
          }
        }, 100);
      }, []);

      // LISTEN DATA NISBAH PENGELOLA
      useEffect(() => {
        let unsub = null;
        const checkNisbah = setInterval(() => {
          if (window.fbDb && window.fbFS) {
            clearInterval(checkNisbah);
            const { doc, onSnapshot } = window.fbFS;
            
            unsub = onSnapshot(doc(window.fbDb, "settings", "nisbah_pengelola"), (docSnap) => {
              if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.pct !== undefined) {
                  setNisbahPengelolaPct(Number(data.pct) || 0);
                }
              }
            }, (err) => {
              console.error("Listener nisbah error:", err);
            });
          }
        }, 100);

        return () => {
          clearInterval(checkNisbah);
          if (unsub) unsub();
        };
      }, []);

      const handleUpdateNisbah = async (newVal) => {
        const pctVal = parseFloat(newVal) || 0;
        setNisbahPengelolaPct(pctVal);

        if (currentUser && currentUser.role === 'Admin') {
          try {
            const { doc, setDoc } = window.fbFS;
            await setDoc(doc(window.fbDb, "settings", "nisbah_pengelola"), {
              pct: pctVal,
              updatedAt: Date.now(),
              updatedBy: currentUser.nama
            }, { merge: true });
            showToast(`✅ Nisbah Pengelola disimpan: ${pctVal}%`);
          } catch (err) {
            console.error("Gagal menyimpan nisbah ke Firestore:", err);
            alert("Gagal menyimpan nisbah ke database!");
          }
        }
      };

      // LISTEN DATA TOOLS / BAHAN PENDUKUNG REALTIME
      useEffect(() => {
        if (!currentUser) return;

        let unsub = null;
        const checkTools = setInterval(() => {
          if (window.fbDb && window.fbFS) {
            clearInterval(checkTools);
            const { collection, query, orderBy, onSnapshot } = window.fbFS;
            const q = query(collection(window.fbDb, "tools_purchases"), orderBy("createdAt", "desc"));

            unsub = onSnapshot(q, (snapshot) => {
              const list = [];
              snapshot.forEach((docSnap) => list.push({ id: docSnap.id, ...docSnap.data() }));
              setToolsList(list);
            });
          }
        }, 100);

        return () => {
          clearInterval(checkTools);
          if (unsub) unsub();
        };
      }, [currentUser]);

      // LISTEN DATA CUSTOMER SERVICE
      useEffect(() => {
        let unsub = null;
        const checkCs = setInterval(() => {
          if (window.fbDb && window.fbFS) {
            clearInterval(checkCs);
            const { doc, onSnapshot } = window.fbFS;
            unsub = onSnapshot(doc(window.fbDb, "settings", "customer_service"), (docSnap) => {
              if (docSnap.exists()) {
                const data = docSnap.data();
                setCsInfo(data);
                setFormCs({
                  namaCs: data.namaCs || '',
                  noWa: data.noWa || '',
                  pesanDefault: data.pesanDefault || ''
                });
              }
            });
          }
        }, 100);

        return () => {
          clearInterval(checkCs);
          if (unsub) unsub();
        };
      }, []);

      // FETCH DAFTAR USERS
      useEffect(() => {
        if (!currentUser || currentUser.role !== 'Admin') return;

        let unsub = null;
        const checkUsers = setInterval(() => {
          if (window.fbDb && window.fbFS) {
            clearInterval(checkUsers);
            const { collection, onSnapshot } = window.fbFS;
            unsub = onSnapshot(collection(window.fbDb, "users"), (snapshot) => {
              const list = [];
              snapshot.forEach((docSnap) => list.push({ uid: docSnap.id, ...docSnap.data() }));
              setUserList(list);
            });
          }
        }, 100);

        return () => {
          clearInterval(checkUsers);
          if (unsub) unsub();
        };
      }, [currentUser]);

      // SINKRONISASI NAMA LOGIN
      useEffect(() => {
        if (currentUser && currentUser.nama) {
          setFormAmbil(prev => ({ ...prev, pengambilSelect: currentUser.nama }));
          setFormOlah(prev => ({ ...prev, pengolahSelect: currentUser.nama }));
          setFormTools(prev => ({ ...prev, pencatatSelect: currentUser.nama }));
        }
      }, [currentUser]);

      useEffect(() => {
        if (!currentUser) return;

        let unsub = null;
        const checkCat = setInterval(() => {
          if (window.fbDb && window.fbFS) {
            clearInterval(checkCat);
            const { collection, query, orderBy, onSnapshot } = window.fbFS;
            const q = query(collection(window.fbDb, "categories"), orderBy("code", "asc"));

            unsub = onSnapshot(q, (snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setCategories(list.length > 0 ? list : DEFAULT_CATEGORIES);
            });
          }
        }, 100);

        return () => {
          clearInterval(checkCat);
          if (unsub) unsub();
        };
      }, [currentUser]);

      useEffect(() => {
        if (!currentUser) return;
        setLoading(true);

        let unsub = null;
        const checkDB = setInterval(() => {
          if (window.fbDb && window.fbFS) {
            clearInterval(checkDB);
            const { collection, query, orderBy, onSnapshot } = window.fbFS;
            const q = query(collection(window.fbDb, "transactions"), orderBy("createdAt", "desc"));

            unsub = onSnapshot(q, (snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setTransactions(list);
              setLoading(false);
            });
          }
        }, 100);

        return () => {
          clearInterval(checkDB);
          if (unsub) unsub();
        };
      }, [currentUser]);

      useEffect(() => {
        if (!currentUser) return;

        let unsub = null;
        const checkPemodal = setInterval(() => {
          if (window.fbDb && window.fbFS) {
            clearInterval(checkPemodal);
            const { collection, query, orderBy, onSnapshot } = window.fbFS;
            const q = query(collection(window.fbDb, "pemodal"), orderBy("createdAt", "desc"));

            unsub = onSnapshot(q, (snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setPemodalList(list);
            });
          }
        }, 100);

        return () => {
          clearInterval(checkPemodal);
          if (unsub) unsub();
        };
      }, [currentUser]);

      useEffect(() => {
        if (!currentUser) return;

        let unsub = null;
        const checkWD = setInterval(() => {
          if (window.fbDb && window.fbFS) {
            clearInterval(checkWD);
            const { collection, query, orderBy, onSnapshot } = window.fbFS;
            const q = query(collection(window.fbDb, "pemodal_withdrawals"), orderBy("createdAt", "desc"));

            unsub = onSnapshot(q, (snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setWithdrawalList(list);
            });
          }
        }, 100);

        return () => {
          clearInterval(checkWD);
          if (unsub) unsub();
        };
      }, [currentUser]);

      useEffect(() => {
        if (!currentUser) return;

        let unsub = null;
        const checkPWD = setInterval(() => {
          if (window.fbDb && window.fbFS) {
            clearInterval(checkPWD);
            const { collection, query, orderBy, onSnapshot } = window.fbFS;
            const q = query(collection(window.fbDb, "pemodal_profit_withdrawals"), orderBy("createdAt", "desc"));

            unsub = onSnapshot(q, (snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setProfitWithdrawalList(list);
            });
          }
        }, 100);

        return () => {
          clearInterval(checkPWD);
          if (unsub) unsub();
        };
      }, [currentUser]);

      useEffect(() => {
        if (!currentUser) return;

        let unsub = null;
        const checkADD = setInterval(() => {
          if (window.fbDb && window.fbFS) {
            clearInterval(checkADD);
            const { collection, query, orderBy, onSnapshot } = window.fbFS;
            const q = query(collection(window.fbDb, "pemodal_additions"), orderBy("createdAt", "desc"));

            unsub = onSnapshot(q, (snapshot) => {
              const list = [];
              snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
              setAdditionList(list);
            });
          }
        }, 100);

        return () => {
          clearInterval(checkADD);
          if (unsub) unsub();
        };
      }, [currentUser]);

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setAuthError('');

        try {
          const { signInWithEmailAndPassword } = window.fbFS;
          await signInWithEmailAndPassword(window.fbAuth, loginEmail.trim(), loginPassword.trim());
          setLoading(false);
          showToast('Berhasil Masuk!');
        } catch (err) {
          setLoading(false);
          setAuthError('Email atau Password salah / Akun belum terdaftar.');
        }
      };

      const handleSignUpSubmit = async (e) => {
        e.preventDefault();
        if (!signupNama.trim() || !signupEmail.trim() || !signupPassword.trim()) {
          return setAuthError('Semua bidang harus diisi!');
        }

        setLoading(true);
        setAuthError('');

        try {
          const { createUserWithEmailAndPassword, doc, setDoc } = window.fbFS;
          const userCred = await createUserWithEmailAndPassword(window.fbAuth, signupEmail.trim(), signupPassword.trim());
          
          await setDoc(doc(window.fbDb, "users", userCred.user.uid), {
            nama: signupNama.trim(),
            email: signupEmail.trim(),
            role: 'Client',
            createdAt: Date.now()
          });

          setLoading(false);
          setAuthSuccess('🎉 Akun Client berhasil dibuat! Silakan masuk.');
          setLoginEmail(signupEmail.trim());
          setSignupNama('');
          setSignupEmail('');
          setSignupPassword('');
          setAuthMode('login');
        } catch (err) {
          setLoading(false);
          setAuthError('Gagal membuat akun: ' + err.message);
        }
      };

      const handleForgotPasswordSubmit = async (e) => {
        e.preventDefault();
        if (!forgotEmail.trim()) {
          return setAuthError('Silakan masukkan email Anda!');
        }

        setLoading(true);
        setAuthError('');
        setAuthSuccess('');

        try {
          const { sendPasswordResetEmail } = window.fbFS;
          await sendPasswordResetEmail(window.fbAuth, forgotEmail.trim());
          setLoading(false);
          setAuthSuccess(`📩 Link reset password telah dikirim ke email "${forgotEmail.trim()}". Periksa kotak masuk/folder Spam Anda.`);
        } catch (err) {
          setLoading(false);
          if (err.code === 'auth/user-not-found') {
            setAuthError('Email tidak terdaftar dalam sistem!');
          } else {
            setAuthError('Gagal mengirim link reset password: ' + err.message);
          }
        }
      };

      const handleAdminResetUserPassword = async (userEmail) => {
        if (!userEmail) return alert("Email pengguna tidak ditemukan!");

        if (window.confirm(`Kirimkan link reset password ke email user "${userEmail}"?`)) {
          setLoading(true);
          try {
            const { sendPasswordResetEmail } = window.fbFS;
            await sendPasswordResetEmail(window.fbAuth, userEmail);
            setLoading(false);
            showToast(`🔑 Link reset password dikirim ke ${userEmail}`);
          } catch (err) {
            setLoading(false);
            alert('Gagal mengirim reset password: ' + err.message);
          }
        }
      };

      const handleLogout = async () => {
        if (window.confirm('Yakin ingin keluar dari sistem?')) {
          const { signOut } = window.fbFS;
          await signOut(window.fbAuth);
          setCurrentUser(null);
        }
      };

      const handleChangeUserRole = async (targetUid, newRole) => {
        if (targetUid === currentUser.uid) {
          return alert("Anda tidak dapat mengubah role akun Anda sendiri!");
        }

        if (window.confirm(`Ubah role user ini menjadi "${newRole}"?`)) {
          setLoading(true);
          try {
            const { doc, updateDoc } = window.fbFS;
            await updateDoc(doc(window.fbDb, "users", targetUid), {
              role: newRole
            });
            setLoading(false);
            showToast('✅ Role pengguna berhasil diperbarui!');
          } catch (err) {
            setLoading(false);
            alert('Gagal mengubah role: ' + err.message);
          }
        }
      };

      const handleDeleteUser = async (targetUser) => {
        if (targetUser.uid === currentUser.uid) {
          return alert("Anda tidak dapat menghapus akun Anda sendiri!");
        }

        if (window.confirm(`Yakin ingin menghapus akun user "${targetUser.nama || targetUser.email}"?`)) {
          setLoading(true);
          try {
            const { doc, deleteDoc } = window.fbFS;
            await deleteDoc(doc(window.fbDb, "users", targetUser.uid));
            setLoading(false);
            showToast('🗑️ Akun pengguna berhasil dihapus!');
          } catch (err) {
            setLoading(false);
            alert('Gagal menghapus user: ' + err.message);
          }
        }
      };

      const handleSaveCsInfo = async (e) => {
        e.preventDefault();
        if (currentUser.role !== 'Admin') {
          return alert('Akses ditolak! Fitur ini hanya untuk Admin.');
        }

        let cleanNoWa = formCs.noWa.replace(/[^0-9]/g, '');
        if (cleanNoWa.startsWith('0')) {
          cleanNoWa = '62' + cleanNoWa.substring(1);
        }

        if (!cleanNoWa) {
          return alert('Nomor WhatsApp harus diisi dengan angka yang valid!');
        }

        setLoading(true);
        try {
          const { doc, setDoc } = window.fbFS;
          await setDoc(doc(window.fbDb, "settings", "customer_service"), {
            namaCs: formCs.namaCs.trim() || 'Customer Service',
            noWa: cleanNoWa,
            pesanDefault: formCs.pesanDefault.trim() || 'Halo, saya ingin bertanya mengenai investasi perak.',
            updatedAt: Date.now()
          });

          setLoading(false);
          showToast('💬 Kontak Customer Service berhasil diperbarui!');
        } catch (err) {
          setLoading(false);
          alert('Gagal menyimpan kontak CS: ' + err.message);
        }
      };

                  <div className="bg-white p-3.5 sm:p-5 rounded-2xl shadow-sm border border-slate-200">
                    <span className="text-[10px] font-semibold text-slate-400 uppercase">Laba Terjual</span>
                    <p className="text-base sm:text-2xl font-black text-amber-600 mt-1">{formatRupiah(pemodalTotalLabaPeriod)}</p>
                  </div>
                  <div className="bg-white p-3.5 sm:p-5 rounded-2xl shadow-sm border border-slate-200">
                    <span className="text-[10px] font-semibold text-slate-400 uppercase">Laba Investor</span>
                    <p className="text-base sm:text-2xl font-black text-emerald-600 mt-1">{formatRupiah(totalLabaUntukPemodal)}</p>
                  </div>
                  <div className="bg-white p-3.5 sm:p-5 rounded-2xl shadow-sm border border-slate-200">
                    <span className="text-[10px] font-semibold text-slate-400 uppercase">Pengelola ({nisbahPengelolaPct}%)</span>
                    <p className="text-base sm:text-2xl font-black text-blue-600 mt-1">{formatRupiah(bagianPengelolaNominal)}</p>
                  </div>
                </div>

                {!isClient && (
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6">
                    <h3 className="font-bold text-slate-800 text-sm mb-3">🤝 Tambah Pemodal Baru</h3>
                    <form onSubmit={handleSavePemodal} className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <input type="text" required placeholder="Nama Investor" value={formPemodal.namaPemodal} onChange={(e) => setFormPemodal({ ...formPemodal, namaPemodal: e.target.value })} className="px-3 py-2 border rounded-xl text-sm" />
                      <input type="number" required placeholder="Jumlah Modal (Rp)" value={formPemodal.jumlahModal} onChange={(e) => setFormPemodal({ ...formPemodal, jumlahModal: e.target.value })} className="px-3 py-2 border rounded-xl text-sm font-bold" />
                      <input type="date" required value={formPemodal.tanggalBergabung} onChange={(e) => setFormPemodal({ ...formPemodal, tanggalBergabung: e.target.value })} className="px-3 py-2 border rounded-xl text-sm" />
                      <input type="text" placeholder="Kontak / WhatsApp" value={formPemodal.kontak} onChange={(e) => setFormPemodal({ ...formPemodal, kontak: e.target.value })} className="px-3 py-2 border rounded-xl text-sm" />
                      <button type="submit" disabled={loading} className="sm:col-span-2 bg-slate-900 text-amber-400 font-bold py-2.5 rounded-xl text-xs">Simpan Pemodal Baru ➔</button>
                    </form>
                  </div>
                )}

                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="p-4 border-b border-slate-200">
                    <h3 className="font-bold text-slate-800 text-xs sm:text-sm">👥 Daftar Investor & Porsi Bagi Hasil</h3>
                  </div>
                  <div className="p-3 space-y-3">
                    {pemodalList.map((p) => {
                      const totalTambahan = additionList.filter(a => a.pemodalId === p.id).reduce((s, a) => s + (a.jumlahTambah || 0), 0);
                      const totalDitarik = withdrawalList.filter(w => w.pemodalId === p.id).reduce((s, w) => s + (w.jumlahTarik || 0), 0);
                      const modalAktif = p.jumlahModal + totalTambahan - totalDitarik;
                      const porsi = totalModalAktifNet > 0 ? ((modalAktif / totalModalAktifNet) * 100) : 0;
                      const hakLaba = (totalLabaUntukPemodal * porsi) / 100;

                      return (
                        <div key={p.id} className="p-3.5 bg-slate-50 border border-slate-200 rounded-xl space-y-2 text-xs">
                          <div className="flex justify-between items-start">
                            <div>
                              <p className="font-bold text-slate-900 text-sm">{p.namaPemodal}</p>
                              <p className="text-[10px] text-slate-500">Bergabung: {p.tanggalBergabung} | Kontak: {p.kontak}</p>
                            </div>
                            <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-extrabold text-[10px]">
                              Porsi: {porsi.toFixed(2)}%
                            </span>
                          </div>

                          <div className="grid grid-cols-2 gap-2 bg-white p-2.5 rounded-lg border text-[11px]">
                            <div>
                              <span className="text-slate-400 block text-[9px]">Modal Aktif:</span>
                              <strong className="text-slate-800">{formatRupiah(modalAktif)}</strong>
                            </div>
                            <div>
                              <span className="text-slate-400 block text-[9px]">Hak Laba Periode Ini:</span>
                              <strong className="text-emerald-600">+{formatRupiah(hakLaba)}</strong>
                            </div>
                          </div>

                          {currentUser.role === 'Admin' && (
                            <div className="flex gap-2 pt-1">
                              <button onClick={() => setSelectedPemodalProfitWD(p)} className="bg-emerald-600 text-white px-2.5 py-1 rounded text-[10px] font-bold">💰 Tarik Laba</button>
                              <button onClick={() => setSelectedPemodalWithdraw(p)} className="bg-red-600 text-white px-2.5 py-1 rounded text-[10px] font-bold">💸 Tarik Modal</button>
                              <button onClick={() => handleDeletePemodal(p.id)} className="text-red-500 text-[10px] font-bold ml-auto">🗑️ Hapus</button>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB RECAP PDF */}
            {activeTab === 'recap_pdf' && (
              <div className="max-w-4xl mx-auto space-y-4 sm:space-y-6">
                <div className="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
                  <div className="bg-slate-900 text-white p-4 sm:p-6 flex justify-between items-center">
                    <div>
                      <h2 className="text-base sm:text-lg font-bold">📄 Recap List & Cetak Laporan PDF</h2>
                      <p className="text-xs text-slate-400 mt-0.5">Ekspor rekapitulasi data transaksi ke format PDF resmi.</p>
                    </div>
                    <button onClick={handleGeneratePDF} className="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-xs shadow">
                      📥 Download PDF
                    </button>
                  </div>

                  <div className="p-4 sm:p-6 space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Judul Laporan PDF</label>
                        <input type="text" value={recapPdfTitle} onChange={(e) => setRecapPdfTitle(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Catatan Tambahan PDF</label>
                        <input type="text" placeholder="e.g. Laporan Rekapitulasi Akhir Bulan" value={recapPdfNotes} onChange={(e) => setRecapPdfNotes(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB DASHBOARD / LAPORAN */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4 sm:space-y-6">
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div className="bg-white p-3.5 sm:p-5 rounded-2xl shadow-sm border border-slate-200">
                    <span className="text-[10px] font-semibold text-slate-400 uppercase">Barang Mentah</span>
                    <p className="text-base sm:text-2xl font-black text-slate-800 mt-0.5">{totalBarangKotor.toFixed(2)}g</p>
                  </div>
                  <div className="bg-white p-3.5 sm:p-5 rounded-2xl shadow-sm border border-slate-200">
                    <span className="text-[10px] font-semibold text-slate-400 uppercase">Perak Murni</span>
                    <p className="text-base sm:text-2xl font-black text-blue-600 mt-0.5">{totalPerakMurni.toFixed(2)}g</p>
                  </div>
                  <div className="bg-white p-3.5 sm:p-5 rounded-2xl shadow-sm border border-slate-200">
                    <span className="text-[10px] font-semibold text-slate-400 uppercase">Omset Jual</span>
                    <p className="text-base sm:text-2xl font-black text-emerald-600 mt-0.5">{formatRupiah(totalOmsetPenjualan)}</p>
                  </div>
                  <div className="bg-white p-3.5 sm:p-5 rounded-2xl shadow-sm border border-slate-200">
                    <span className="text-[10px] font-semibold text-slate-400 uppercase">Laba Bersih</span>
                    <p className="text-base sm:text-2xl font-black text-amber-600 mt-0.5">{formatRupiah(totalLabaBersih)}</p>
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
                  <input
                    type="text"
                    placeholder="🔍 Cari kode, kategori, tempat, atau petugas..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full px-4 py-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500"
                  />
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="p-4 border-b border-slate-200 flex justify-between items-center">
                    <h3 className="font-bold text-slate-800 text-xs sm:text-sm">Riwayat Transaksi Pemurnian ({filteredTransactions.length})</h3>
                  </div>

                  <div className="p-3 space-y-3">
                    {filteredTransactions.length === 0 ? (
                      <p className="text-center py-8 text-xs text-slate-400">Tidak ada transaksi yang cocok dengan pencarian.</p>
                    ) : (
                      filteredTransactions.map((t) => (
                        <div key={t.id} className="p-3.5 bg-slate-50 border border-slate-200 rounded-xl space-y-2 text-xs">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-slate-900 bg-amber-100 text-amber-900 px-2 py-0.5 rounded text-[10px]">{t.codeId}</span>
                            <span className={`px-2 py-0.5 rounded text-[9px] font-extrabold uppercase ${
                              t.status === 'TERJUAL' ? 'bg-emerald-100 text-emerald-800' :
                              t.status === 'SELESAI_OLAH' ? 'bg-blue-100 text-blue-800' : 'bg-slate-200 text-slate-700'
                            }`}>
                              {t.status}
                            </span>
                          </div>

                          <div className="flex justify-between items-start">
                            <div>
                              <p className="font-bold text-slate-800 text-sm">{t.kategoriName}</p>
                              <p className="text-[10px] text-slate-500">{t.tempatAmbil} ({t.lokasiAmbil || '-'}) | PIC: {t.pengambil}</p>
                            </div>
                            <div className="text-right">
                              <span className="font-bold text-slate-900 block">{t.jumlahKotor}g (Kotor)</span>
                              {t.jumlahMurni > 0 && <span className="font-bold text-blue-600 block">{t.jumlahMurni}g (Murni)</span>}
                            </div>
                          </div>

                          <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 bg-white p-2 rounded-lg border text-[10px]">
                            <div>
                              <span className="text-slate-400 block">Total Modal Beli:</span>
                              <span className="font-bold text-slate-800">{formatRupiah(t.totalBeli)}</span>
                            </div>
                            <div>
                              <span className="text-slate-400 block">Total Omset Jual:</span>
                              <span className="font-bold text-emerald-600">{formatRupiah(t.totalJual)}</span>
                            </div>
                            <div>
                              <span className="text-slate-400 block">Laba Bersih:</span>
                              <span className="font-bold text-amber-600">{formatRupiah(t.totalUntung)}</span>
                            </div>
                          </div>

                          {currentUser.role === 'Admin' && (
                            <div className="flex justify-end pt-1">
                              <button onClick={() => handleDeleteTransaction(t.id)} className="text-red-500 hover:text-red-700 font-bold text-[10px]">🗑️ Hapus Transaksi</button>
                            </div>
                          )}
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
